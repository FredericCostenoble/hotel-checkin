when = "days_before_arrival"
days = 7
only_if = ["form_not_completed", "not_cancelled"]
channels = ["email"]
skip_if_booked_late = true
pay = "none"

[[flows.expedia.steps]]
step = "access_code"   # pincode en praktische info
when = "days_before_arrival"
days = 2
only_if = ["not_cancelled"]
channels = ["email", "sms"]
pay = "open_amount"

[[flows.expedia.steps]]
step = "thank_you"   # bedankmail na vertrek
when = "days_after_departure"
days = 1
only_if = ["not_cancelled"]
channels = ["email"]
pay = "none"

[[flows.expedia.steps]]
step = "payment_request"   # betaalverzoek als er na vertrek nog iets openstaat
when = "days_after_departure"
days = 1
only_if = ["not_cancelled", "not_paid"]
channels = ["email"]
pay = "open_amount"

[flows.website_paid]
sources = []                 # alle andere kanalen
paid = true

[[flows.website_paid.steps]]

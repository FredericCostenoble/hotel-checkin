# Workflow: welke stappen wanneer, apart per flow (zie src/hotel_checkin/core/workflow.py).
# Dit is de standaard; in de monitor (tabblad Workflow) kan hij gewijzigd worden en die versie gaat voor.
# Flows: booking (Booking.com), expedia (Expedia), website_paid en website_unpaid (andere kanalen,
# volgens betaalstatus). Per stap: when = after_booking of days_before_arrival (met days),
# only_if = voorwaarden, skip_if_booked_late = geen herinnering als de boeking pas op of na die dag
# kwam, pay = betaalknop (none of open_amount: wat nog openstaat, alleen de taks of alles). Vaste regel: een bericht gaat niet weg als
# een later bericht nu al aan de beurt is (late boeking: meteen alleen de code-mail).

[workflow_parameters]
city_tax_amount = 4.2            # toeristenbelasting in euro (Brugge, zoals Lighthouse ze aanrekent: 4,20 per persoon per nacht)
city_tax_unit = "person_night"   # per persoon per nacht (person_night) of per persoon per verblijf (person_stay)
currency = "EUR"

# Per kanaal een flow; per stap kan in de monitor (tabblad Workflow) per tarief (NFR, Standaard) gekozen worden
# welke onderdelen in de mail staan (rates = { nfr = {...}, standard = {...} }, zie core/workflow.py).
# Zonder keuze per tarief gelden content en pay hieronder voor beide tarieven.
[flows.booking]
sources = ["Booking.com"]   # herkend aan het kanaal ("Via")

[[flows.booking.steps]]
step = "confirmation"   # mail met link naar het check-in-formulier
when = "after_booking"
only_if = ["not_cancelled"]
channels = ["email"]
pay = "none"

[[flows.booking.steps]]
step = "reminder"   # herinnering als het formulier niet ingevuld is
when = "days_before_arrival"
days = 7
only_if = ["form_not_completed", "not_cancelled"]
channels = ["email"]
skip_if_booked_late = true
pay = "none"

[[flows.booking.steps]]
step = "access_code"   # pincode en praktische info
when = "days_before_arrival"
days = 2
only_if = ["room_paid", "not_cancelled"]
channels = ["email", "sms"]
pay = "open_amount"

[[flows.booking.steps]]
step = "thank_you"   # bedankmail na vertrek; betaalknop alleen als er nog iets openstaat
when = "days_after_departure"
days = 1
only_if = ["not_cancelled"]
channels = ["email"]
pay = "open_amount"

[flows.expedia]
sources = ["Expedia"]

[[flows.expedia.steps]]
step = "confirmation"   # mail met link naar het check-in-formulier
when = "after_booking"
only_if = ["not_cancelled"]
channels = ["email"]
pay = "none"

[[flows.expedia.steps]]
step = "reminder"   # herinnering als het formulier niet ingevuld is
when = "days_before_arrival"
days = 7
only_if = ["form_not_completed", "not_cancelled"]
channels = ["email"]
skip_if_booked_late = true
pay = "none"

[[flows.expedia.steps]]
step = "access_code"   # pincode en praktische info
when = "days_before_arrival"
days = 2
only_if = ["room_paid", "not_cancelled"]
channels = ["email", "sms"]
pay = "open_amount"

[[flows.expedia.steps]]
step = "thank_you"   # bedankmail na vertrek; betaalknop alleen als er nog iets openstaat
when = "days_after_departure"
days = 1
only_if = ["not_cancelled"]
channels = ["email"]
pay = "open_amount"

[flows.website]
# Alle andere kanalen (website, telefoon, ...). Eén flow, betaald of niet: wat er nog openstaat, bepaalt
# de inhoud van de mail (betaalknop alleen als er iets openstaat en Lighthouse een betaallink gaf).
sources = []

[[flows.website.steps]]
step = "confirmation"   # mail met link naar het check-in-formulier
when = "after_booking"
only_if = ["not_cancelled"]
channels = ["email"]
pay = "none"

[[flows.website.steps]]
step = "reminder"   # herinnering als het formulier niet ingevuld is
when = "days_before_arrival"
days = 7
only_if = ["form_not_completed", "not_cancelled"]
channels = ["email"]
skip_if_booked_late = true
pay = "none"

[[flows.website.steps]]

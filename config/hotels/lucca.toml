dag = 1                       # voor welke dag: 1 = morgen, 0 = vandaag
email = ["management@hotellucca.be"]   # mail met de Excel als bijlage; leeg = geen mail
whatsapp = []                 # gsm-nummers (+32...): WhatsApp, of sms als er geen WhatsApp-sjabloon is

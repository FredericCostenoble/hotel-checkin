# Instellingen van Hotel Lucca (hotel_id = bestandsnaam: "lucca").
# Een nieuw hotel = een nieuw bestand in config/hotels/ met dezelfde secties.
# Instellingen van het hotel die in de berichten aan gasten gebruikt worden.
# Pas hier aan, niet in de teksten. In de teksten verwijs je ernaar met {veldnaam},
# bv. {hotel_naam} of {receptie_van}. Elke sleutel hieronder wordt een veld met de
# naam <sectie>_<sleutel>, behalve in [hotel] waar het hotel_<sleutel> is.

[hotel]
naam = "Hotel Lucca"
adres = "Naaldenstraat 30, 8000 Brugge"
telefoon = "+32 471 18 15 74"
email = "info@hotellucca.be"   # contactadres voor gasten (mails versturen gebeurt technisch via MAIL_SENDER)
website = "https://www.hotellucca.be"
logo_url = "https://hotellucca.be/wp-content/uploads/2025/06/Logo-website-hotel-lucca.png"

[verzending]
# Technische afzender van mails (gedeelde mailbox met RBAC for Applications). Gasten zien hem niet als contact.
mail_afzender = "checkin@hotellucca.be"

[receptie]
van = "14:00"
tot = "18:30"

[checkout]
tot = "11:00"

[ontbijt]
van = "8:30"
tot = "10:30"

[wifi]
naam = "HotelLucca"        # TODO: juiste naam invullen
wachtwoord = "********"    # TODO: juist wachtwoord invullen

[parking]
naam = "Biekorf"
minuten = "2"

[nood]
nummer = "+32 471 18 15 74"   # TODO: nummer voor 's avonds en 's nachts

[twilio]
# Afzendnummers van dit hotel (niet geheim). Het Twilio-account zelf is gedeeld (Key Vault).
sms_from = "+4915888620339"        # TODO: trialnummer, vervangen door eigen nummer na opwaardering
whatsapp_from = "+4915888620339"   # TODO: idem

[robot]
# De robot zoekt bij elke run nieuwe reservaties. Om de zoveel uur leest hij ook de contactgegevens
# opnieuw van reservaties die binnenkort aankomen en nog geen e-mailadres hebben.
# check_minutes: hoe vaak naar nieuwe reservaties kijken. Nooit sneller dan het schema van de job
# (GitHub-variabele ROBOT_SCHEDULE per omgeving). Per omgeving te overschrijven met Key Vault-geheim
# lucca-robot-check-minutes (bv. trager in TST).
check_minutes = 15
contact_refresh_hours = 2

[lighthouse]
# Reservation Manager. Aanmelden met robotgebruiker uit Key Vault: lucca-lighthouse-username / -password
base_url = "https://reservationmanager.mylighthouse.com"

[checkin]
# Link naar het online check-in-formulier (nog te bouwen). {token} wordt per gast ingevuld.
formulier_url = "https://checkin.hotellucca.be/?r={token}"

[privacy]
# URL van de privacyverklaring per taal (komt van Wim, de webdesigner). TODO: invullen.
url_nl = "https://www.hotellucca.be/privacy"
url_fr = "https://www.hotellucca.be/privacy"
url_en = "https://www.hotellucca.be/privacy"
url_de = "https://www.hotellucca.be/privacy"

[kleuren]
accent = "#B4BCCC"        # grijsblauw van het logo
accent_donker = "#5C6478" # knoppen en titels
tekst = "#2B2F38"
achtergrond = "#F4F5F8"

# Workflow: welke stappen wanneer (zie src/hotel_checkin/core/workflow.py).
# step = berichttype (teksten in messaging/texts) of actie; when = after_booking,
# days_before_arrival (met days) of at_start; only_if = voorwaarden; channels = email, sms, whatsapp.

[[workflow]]
step = "confirmation"            # mail met link naar het check-in-formulier
when = "after_booking"
only_if = ["not_cancelled"]
channels = ["email"]

[[workflow]]
step = "reminder"                # herinnering als het formulier nog niet ingevuld is
when = "days_before_arrival"
days = 7
only_if = ["form_not_completed", "not_cancelled"]
channels = ["email"]

[[workflow]]
step = "access_code"             # pincode en praktische info
when = "days_before_arrival"
days = 1
only_if = ["paid", "not_cancelled"]
channels = ["email", "sms"]

tot = "10:30"
# Label op het planbord voor wie ontbijt heeft (hoofdschakelaar ontbijt_labels, processes/breakfast_labels.py):
# naam van het label in Lighthouse, en voor aankomsten binnen hoeveel dagen (0 = alle toekomstige reservaties).

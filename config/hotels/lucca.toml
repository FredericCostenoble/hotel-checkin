whatsapp_from = "+4915888620339"   # TODO: idem

[robot]
# De robot zoekt bij elke run nieuwe reservaties. Om de zoveel uur leest hij ook de contactgegevens
# opnieuw van reservaties die binnenkort aankomen en nog geen e-mailadres hebben.
# check_minutes: hoe vaak naar nieuwe reservaties kijken als vangnet (normaal start de meldingsmail de robot). Nooit sneller dan het schema van de job
# (GitHub-variabele ROBOT_SCHEDULE per omgeving). Per omgeving te overschrijven met Key Vault-geheim
# lucca-robot-check-minutes (bv. trager in TST).
check_minutes = 0  # 0 = elke run op schema (elk heel uur) gaat door, ook na een manuele run
contact_refresh_hours = 2
# mail_trigger: de mailbox van checkin@ elke minuut nakijken op meldingen van Lighthouse/Cubilis
# (via een regel doorgestuurd van info@) en dan meteen de robot starten. Per omgeving uit te zetten
# met Key Vault-geheim lucca-robot-mail-trigger = false.
mail_trigger = true

[bewaking]
# Dagelijks overzicht van de aankomsten en waarschuwingen als er iets misloopt (processes/oversight.py).
# Buiten PRD gaan deze mails naar het testadres ([test] email).
# Eén mail per dag, 's ochtends: aankomsten van vandaag en morgen, wat er de voorbije 24 uur gebeurde, en wat
# misliep (ook de robot). Geen andere mails, tenzij controle_uren of robot_waarschuwing aangezet worden.
email = ["management@hotellucca.be"]          # het dagelijkse overzicht
overzicht_uur = "07:30"                       # dagelijks overzicht
controle_uren = []                            # extra controles op die uren met een mail als iets ontbreekt (uit)
robot_max_uren = 3                            # in het overzicht: robot zo lang niet gelukt = probleem
robot_waarschuwing = false                    # aparte mail als de robot stilvalt (uit: staat in het overzicht)

[betaalverzoek]
# De robot maakt in Lighthouse een betaalverzoek (online transactie, Betaling, Stuur verzoek) voor het
# openstaande saldo; de mail gaat naar de eigen mailbox ([verzending] afzender), nooit naar de gast. De link
# daaruit komt als betaalknop in de mails (processes/pay_requests.py).
template = "Betaalverzoek"   # naam van de e-mail template in Lighthouse
dagen_vooraf = 2             # zoveel dagen voor een bericht met betaalknop

[messaging]
# Berichten uit de workflow (processes/send_messages.py). Aan of uit met de hoofdschakelaar [schakelaars] berichten.
# Buiten PRD gaat alles naar het testadres ([test] hierboven).
# Alleen reservaties die vanaf dit moment toegevoegd worden, krijgen berichten (de bestaande niet).
start = "2026-10-30T15:30:00+01:00"
# WhatsApp (met sms als terugval) naast de mail. Aan zodra Twilio betaald is.
phone = false

[whatsapp]
# Door Meta goedgekeurde sjablonen (Twilio Content SID, HX...) per bericht en taal; ontbreekt de
# taal, dan Engels. Zonder sjabloon gaat het bericht meteen per sms.
# Plaatsen in het sjabloon: confirmation en reminder {{1}} voornaam, {{2}} link naar het formulier;

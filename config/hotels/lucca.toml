# Instellingen van Hotel Lucca (hotel_id = bestandsnaam: "lucca").
# Een nieuw hotel = een nieuw bestand in config/hotels/ met dezelfde secties.
# Instellingen van het hotel die in de berichten aan gasten gebruikt worden.
# Pas hier aan, niet in de teksten. In de teksten verwijs je ernaar met {veldnaam},
# bv. {hotel_naam} of {receptie_van}. Elke sleutel hieronder wordt een veld met de
# naam <sectie>_<sleutel>, behalve in [hotel] waar het hotel_<sleutel> is.

[schakelaars]
# HOOFDSCHAKELAARS, per omgeving apart in te stellen in de monitor (instellingen, tabblad Hotel). Standaard uit.
# overschrijvingen: de robot registreert de betaling van Booking.com als overschrijving in Lighthouse (processes/booking_payout.py).
# berichten: mails, sms en WhatsApp aan gasten, en de pincodes bij Salto (die gaan alleen mee met de code-mail).
# ontbijt_labels: de robot zet het label ONTBIJT op het planbord bij wie ontbijt heeft (tarief met ontbijt,
# of ontbijt voor alle personen en nachten in de folio).
# ontbijtlijst en kuislijst: elke dag de lijst maken en versturen (processes/daily_lists.py), zie [ontbijtlijst] en [kuislijst].
overschrijvingen = false
berichten = false
ontbijt_labels = false
ontbijtlijst = false
kuislijst = false

[hotel]
naam = "Hotel Lucca"
tijdzone = "Europe/Brussels"   # kalender van de workflow (herinnering, code-mail, opruimen)
adres = "Naaldenstraat 30, 8000 Brugge"
telefoon = "+32 471 18 15 74"
email = "info@hotellucca.be"   # contactadres voor gasten (mails versturen gebeurt technisch via MAIL_SENDER)
website = "https://www.hotellucca.be"
# Website per taal (logo en link onderaan de mails). Leeg = website hierboven.
website_nl = "https://hotellucca.be/nl/hotel-brugge-centrum/"
website_fr = "https://hotellucca.be/fr/hotel-bruges-centre/"
website_en = "https://hotellucca.be/en/hotel-bruges-city-centre/"
website_de = "https://hotellucca.be/de/hotel-bruegge-zentrum/"
logo_url = "https://hotellucca.be/wp-content/uploads/2025/06/Logo-website-hotel-lucca.png"

[test]
# Buiten PRD (TST en codespace) gaat elk bericht naar dit adres en nummer, nooit naar de gast.
# Leeg = niets versturen.
email = "frederic@hotellucca.be"
phone = ""
# Reservaties van deze gasten (achternaam) zijn testreservaties: de robot mag er ook in TST in Lighthouse
# schrijven (bv. de overschrijving van Booking.com registreren). Echte reservaties leest TST alleen.
guest_names = ["meersseman"]

[reviews]
# Link om een review te schrijven, in de bedankmail na het verblijf. Leeg = geen knop.
google_url = "https://search.google.com/local/writereview?placeid=ChIJk9bCqtFQw0cR-x4oBzgi52s"
other_url = ""   # bv. Tripadvisor

[verzending]
# Technische afzender van mails (gedeelde mailbox met RBAC for Applications). Gasten zien hem niet als contact.
mail_afzender = "checkin@hotellucca.be"

[receptie]
van = "14:00"
tot = "18:30"

[checkout]
tot = "11:00"
kamer_tot = "12:00"      # op de dag van vertrek werkt de code aan de kamerdeur nog tot dit uur (marge na de check-out, niet in de mails)
voordeur_tot = "23:59"   # op de dag van vertrek werkt de code aan de voordeur (en andere gemeenschappelijke deuren) nog tot dit uur

[ontbijt]

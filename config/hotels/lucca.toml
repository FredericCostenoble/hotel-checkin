# Instellingen van Hotel Lucca (hotel_id = bestandsnaam: "lucca").
# Een nieuw hotel = een nieuw bestand in config/hotels/ met dezelfde secties.
# Instellingen van het hotel die in de berichten aan gasten gebruikt worden.
# Pas hier aan, niet in de teksten. In de teksten verwijs je ernaar met {veldnaam},
# bv. {hotel_naam} of {receptie_van}. Elke sleutel hieronder wordt een veld met de
# naam <sectie>_<sleutel>, behalve in [hotel] waar het hotel_<sleutel> is.

[hotel]
naam = "Hotel Lucca"
adres = "Naaldenstraat 30, 8000 Brugge"
telefoon = "+32 471 18 15 74"
email = "info@hotellucca.be"   # contactadres voor gasten (mails versturen gebeurt technisch via MAIL_SENDER)
website = "https://www.hotellucca.be"
# Website per taal (logo en link onderaan de mails). Leeg = website hierboven.
website_nl = "https://hotellucca.be/nl/hotel-brugge-centrum/"
website_fr = "https://hotellucca.be/fr/hotel-bruges-centre/"
website_en = "https://hotellucca.be/en/hotel-bruges-city-centre/"
website_de = "https://hotellucca.be/de/hotel-bruegge-zentrum/"
logo_url = "https://hotellucca.be/wp-content/uploads/2025/06/Logo-website-hotel-lucca.png"

[verzending]
# Technische afzender van mails (gedeelde mailbox met RBAC for Applications). Gasten zien hem niet als contact.
mail_afzender = "checkin@hotellucca.be"

[receptie]
van = "14:00"
tot = "18:30"

[checkout]
tot = "11:00"

[ontbijt]
van = "8:30"
tot = "10:30"

[wifi]
naam = "HotelLucca"        # TODO: juiste naam invullen
wachtwoord = "********"    # TODO: juist wachtwoord invullen

[parking]
naam = "Biekorf"
minuten = "2"

[nood]
nummer = "+32 471 18 15 74"   # TODO: nummer voor 's avonds en 's nachts

[twilio]
# Afzendnummers van dit hotel (niet geheim). Het Twilio-account zelf is gedeeld (Key Vault).
sms_from = "+4915888620339"        # TODO: trialnummer, vervangen door eigen nummer na opwaardering
whatsapp_from = "+4915888620339"   # TODO: idem

[robot]
# De robot zoekt bij elke run nieuwe reservaties. Om de zoveel uur leest hij ook de contactgegevens
# opnieuw van reservaties die binnenkort aankomen en nog geen e-mailadres hebben.
# check_minutes: hoe vaak naar nieuwe reservaties kijken als vangnet (normaal start de meldingsmail de robot). Nooit sneller dan het schema van de job
# (GitHub-variabele ROBOT_SCHEDULE per omgeving). Per omgeving te overschrijven met Key Vault-geheim
# lucca-robot-check-minutes (bv. trager in TST).
check_minutes = 60
contact_refresh_hours = 2
# mail_trigger: de mailbox van checkin@ elke minuut nakijken op meldingen van Lighthouse/Cubilis
# (via een regel doorgestuurd van info@) en dan meteen de robot starten. Per omgeving uit te zetten
# met Key Vault-geheim lucca-robot-mail-trigger = false.
mail_trigger = true

[messaging]
# Berichten uit de workflow (processes/send_messages.py). Per omgeving aan of uit.
# Buiten PRD gaat alles naar het testadres (TEST_EMAIL). PRD pas aanzetten als alles getest is.
enabled_tst = true
enabled_prd = false
# Alleen reservaties die vanaf dit moment toegevoegd worden, krijgen berichten (de bestaande niet).
start = "2026-10-30T15:30:00+01:00"
# WhatsApp (met sms als terugval) naast de mail. Aan zodra Twilio betaald is.
phone = false

[whatsapp]
# Door Meta goedgekeurde sjablonen (Twilio Content SID, HX...) per bericht en taal; ontbreekt de
# taal, dan Engels. Zonder sjabloon gaat het bericht meteen per sms.
# Plaatsen in het sjabloon: confirmation en reminder {{1}} voornaam, {{2}} link naar het formulier;
# access_code {{1}} voornaam, {{2}} pincode, {{3}} kamer.
# template_confirmation_nl = "HX..."

[retention]
# Opruimen bij het synchroniseren van de gasten (processes/maintenance.py). Dagen na vertrek / na het laatste verblijf.
# reservation_days: reservaties en hun berichtenlog (privacyverklaring: einde verblijf + max. 1 maand).
# guest_days: gastprofielen (soft opt-in: max. 2 jaar na het laatste verblijf).
reservation_days = 30
guest_days = 730

[salto]
# Salto KS (KS Connect API), zie src/hotel_checkin/access/salto.py en projectnotitie claude/salto-ks-connect.md.
# Aanmeldgegevens in Key Vault: lucca-salto-client-id, -client-secret, -username, -password.
# Test (developer kit): de standaardadressen hieronder. Productie: identity_url = "https://identity.eu.my-clay.com",
# api_url = productieadres van Salto (nog te bevestigen). Per omgeving te overschrijven in Key Vault
# (lucca-salto-identity-url, lucca-salto-api-url, lucca-salto-site-id).
identity_url = "https://identity-acc.eu.my-clay.com"
api_url = "https://clp-accept-user.my-clay.com"
site_id = ""                       # TODO: id van de site (na levering van de kit); leeg = Salto uit
guest_role_id = ""                 # leeg = de rol met "guest" of "gast" in de naam
common_lock_ids = []               # TODO: voordeur en andere gemeenschappelijke deuren (python -m hotel_checkin.access.salto lucca)

[salto.rooms]
# kamernummer = id van de deur bij Salto (of een lijst van ids), bv. "12" = "a1b2c3..."

[lighthouse]
# Reservation Manager. Aanmelden met robotgebruiker uit Key Vault: lucca-lighthouse-username / -password
base_url = "https://reservationmanager.mylighthouse.com"

[checkin]
# Link naar het online check-in-formulier (nog te bouwen). {token} wordt per gast ingevuld.
formulier_url = "https://checkin.hotellucca.be/?r={token}"

[privacy]
# URL van de privacyverklaring per taal (komt van Wim, de webdesigner). TODO: invullen.
url_nl = "https://www.hotellucca.be/privacy"
url_fr = "https://www.hotellucca.be/privacy"
url_en = "https://www.hotellucca.be/privacy"
url_de = "https://www.hotellucca.be/privacy"

[kleuren]
accent = "#B4BCCC"        # grijsblauw van het logo
accent_donker = "#5C6478" # knoppen en titels
tekst = "#2B2F38"
achtergrond = "#F4F5F8"

# Workflow: welke stappen wanneer, apart per flow (zie src/hotel_checkin/core/workflow.py).
# Dit is de standaard; in de monitor (tabblad Workflow) kan hij gewijzigd worden en die versie gaat voor.
# Flows: booking (Booking.com), expedia (Expedia), website_paid en website_unpaid (andere kanalen,
# volgens betaalstatus). Per stap: when = after_booking of days_before_arrival (met days),
# only_if = voorwaarden, skip_if_booked_late = geen herinnering als de boeking pas op of na die dag
# kwam, pay = betaalknop (none of open_amount: wat nog openstaat, alleen de taks of alles). Vaste regel: een bericht gaat niet weg als
# een later bericht nu al aan de beurt is (late boeking: meteen alleen de code-mail).

[workflow_parameters]
city_tax_amount = 5.0            # toeristenbelasting in euro
city_tax_unit = "person_night"   # per persoon per nacht (person_night) of per persoon per verblijf (person_stay)
currency = "EUR"

[flows.booking]
sources = ["Booking.com"]   # herkend aan het kanaal ("Via")

[[flows.booking.steps]]
step = "confirmation"   # mail met link naar het check-in-formulier
when = "after_booking"
only_if = ["not_cancelled"]
channels = ["email"]
pay = "none"

[[flows.booking.steps]]
step = "reminder"   # herinnering als het formulier niet ingevuld is
when = "days_before_arrival"
days = 7
only_if = ["form_not_completed", "not_cancelled"]
channels = ["email"]
skip_if_booked_late = true
pay = "none"

[[flows.booking.steps]]
step = "access_code"   # pincode en praktische info
when = "days_before_arrival"
days = 2
only_if = ["not_cancelled"]
channels = ["email", "sms"]
pay = "open_amount"

[[flows.booking.steps]]
step = "thank_you"   # bedankmail na vertrek
when = "days_after_departure"
days = 1
only_if = ["not_cancelled"]
channels = ["email"]
pay = "none"

[[flows.booking.steps]]
step = "payment_request"   # betaalverzoek als er na vertrek nog iets openstaat
when = "days_after_departure"
days = 1
only_if = ["not_cancelled", "not_paid"]
channels = ["email"]
pay = "open_amount"

[flows.expedia]
sources = ["Expedia"]

[[flows.expedia.steps]]
step = "confirmation"   # mail met link naar het check-in-formulier
when = "after_booking"
only_if = ["not_cancelled"]
channels = ["email"]
pay = "none"

[[flows.expedia.steps]]

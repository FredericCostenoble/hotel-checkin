# WhatsApp-sjablonen van Hotel Lucca: de standaardteksten.
# Wijzigen en indienen bij Meta gebeurt in de monitor (instellingen, WhatsApp); de gewijzigde teksten staan dan in de
# database en gaan voor op dit bestand. Plaatsen ({{1}}, {{2}}, ...) en waar ze vandaan komen:
# processes/whatsapp_templates.py, TEMPLATES. De knop en de pdf krijgen hun adres automatisch.
# header = titel (vet bovenaan, hoogstens 60 tekens; niet bij de lijsten, daar staat de pdf bovenaan).
# Regels van Meta: niet beginnen of eindigen met een plaats, geen twee plaatsen na elkaar, knoptekst hoogstens
# 20 tekens, voettekst hoogstens 60 tekens.
# Nooit de pincode zelf (het getal): Meta keurt dat af ("Category mismatch", moet Verificatie zijn, 21/11/2026).
# Het woord pincode mag in het Nederlands (goedgekeurd 22/11/2026); in FR, EN en DE werd "PIN code" afgewezen
# (22/11/2026), daar staat het er niet in. De code staat in de mail en in de app achter de knop.


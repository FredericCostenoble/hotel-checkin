# Testen en uitrollen naar Azure.
# - Elke push op main: tests, daarna uitrol naar TST.
# - PRD: alleen manueel (Actions > Deploy > Run workflow > prd).
# Aanmelden bij Azure zonder secrets (OIDC, federated credential per omgeving), zie infra/README.md.
# Regio's instelbaar met de GitHub-variabelen AZURE_LOCATION en SWA_LOCATION (zie infra/README.md).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Omgeving
        type: choice
        options: [tst, prd]
        default: tst

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'tst' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[storage,functions,dev]'
      - run: pytest -q
      # Fouten zoals een ontbrekende import vroeg opvangen
      - run: ruff check --select F src function_app.py

  deploy:
    needs: test
    # Overslaan zolang infra/setup.sh nog niet gedraaid heeft
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'tst' }}
    env:
      ENV_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'tst' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Containerregister (gedeeld, in rg-checkin-prd)
        id: acr
        run: |
          out=$(az deployment group create \
            --resource-group rg-checkin-prd \
            --name "registry-$ENV_NAME-${{ github.run_number }}" \
            --template-file infra/registry.bicep \
            --parameters location="${{ vars.AZURE_LOCATION || 'belgiumcentral' }}" \
            --query properties.outputs -o json)
          echo "server=$(jq -r .loginServer.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .name.value <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Robot-image bouwen en opladen
        id: image
        run: |
          IMG="${{ steps.acr.outputs.server }}/hotel-checkin-robot:${{ github.sha }}"
          az acr login --name "${{ steps.acr.outputs.name }}"
          if ! docker manifest inspect "$IMG" >/dev/null 2>&1; then
            docker build -f Dockerfile.robot -t "$IMG" .
            docker push "$IMG"
          fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Infrastructuur (Bicep)
        id: infra
        run: |
          STARTER=$(az role definition list --name "Container Apps Jobs Operator" --query "[0].name" -o tsv || true)
          out=$(az deployment group create \
            --resource-group "rg-checkin-$ENV_NAME" \
            --name "checkin-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters env="$ENV_NAME" \
                         location="${{ vars.AZURE_LOCATION || 'belgiumcentral' }}" \
                         swaLocation="${{ vars.SWA_LOCATION || 'eastus2' }}" \
                         formOrigins="${{ vars.FORM_ORIGINS }}" \
                         customDomain="${{ vars.CUSTOM_DOMAIN }}" \
                         adminClientId="${{ vars.ADMIN_CLIENT_ID }}" \
                         robotImage="${{ steps.image.outputs.image }}" \
                         acrName="${{ steps.acr.outputs.name }}" \
                         acrResourceGroup=rg-checkin-prd \
                         robotStarterRoleId="$STARTER" \
                         budgetAmount="${{ vars.BUDGET_AMOUNT || '0' }}" \
                         robotSchedule="${{ vars.ROBOT_SCHEDULE || '*/20 * * * *' }}" \
                         alertEmail="${{ vars.ALERT_EMAIL }}" \
                         testEmail="${{ vars.TEST_EMAIL }}" \
                         testPhone="${{ vars.TEST_PHONE }}" \
                         kvAdminObjectId="${{ vars.KV_ADMIN_OBJECT_ID }}" \
            --query properties.outputs -o json)
          echo "func=$(jq -r .functionAppName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "swa=$(jq -r .staticWebAppName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "funchost=$(jq -r .functionAppHost.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "Opvolgpagina: $(jq -r .adminUrl.value <<<"$out")" >> "$GITHUB_STEP_SUMMARY"
          echo "Formulier: $(jq -r .formUrl.value <<<"$out") (standaard: https://$(jq -r .staticWebAppHost.value <<<"$out"))" >> "$GITHUB_STEP_SUMMARY"

      - name: Pakket Function App klaarzetten
        run: |
          mkdir -p build/func
          cp function_app.py host.json build/func/
          cp requirements.txt build/func/requirements.txt
          cp -r src/hotel_checkin config build/func/
          mkdir -p build/func/web && cp -r web/admin build/func/web/
          # Versienummer in de links naar css/js, zodat de browser nooit een oude versie mengt
          sed -i "s/__VERSION__/${{ github.run_number }}/g" build/func/web/admin/index.html

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.func }}
          package: build/func
          sku: flexconsumption
          remote-build: true

      - name: Adres van de API in het formulier zetten
        run: echo 'window.CHECKIN_API = "https://${{ steps.infra.outputs.funchost }}";' > web/checkin/config.js

      - name: Deploymenttoken Static Web App
        id: swa
        run: |
          token=$(az staticwebapp secrets list --name "${{ steps.infra.outputs.swa }}" \
            --resource-group "rg-checkin-$ENV_NAME" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: web/checkin
          skip_app_build: true

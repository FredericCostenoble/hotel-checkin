# Diagnose (alleen lezen): WhatsApp-sjablonen bij Twilio met hun status en de reden van Meta.
name: WhatsApp templates diag
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [prd, tst]
        default: prd
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          rg="rg-checkin-${{ inputs.environment }}"
          kv=$(az keyvault list -g "$rg" --query "[?!contains(name,'sess')].name | [0]" -o tsv)
          sid=""; tok=""
          for p in lucca- ""; do
            [ -z "$sid" ] && sid=$(az keyvault secret show --vault-name "$kv" -n "${p}twilio-account-sid" --query value -o tsv 2>/dev/null || true)
            [ -z "$tok" ] && tok=$(az keyvault secret show --vault-name "$kv" -n "${p}twilio-auth-token" --query value -o tsv 2>/dev/null || true)
          done
          echo "::add-mask::$tok"
          curl -s -u "$sid:$tok" "https://content.twilio.com/v1/Content?PageSize=100" > list.json
          jq -r '.contents[]? | [.sid, .friendly_name, .language] | @tsv' list.json | while IFS=$'\t' read -r csid name lang; do
            a=$(curl -s -u "$sid:$tok" "https://content.twilio.com/v1/Content/$csid/ApprovalRequests")
            echo "$name	$lang	$(jq -r '[.whatsapp.status // "-", .whatsapp.category // "-", .whatsapp.rejection_reason // ""] | @tsv' <<<"$a")"
          done
          jq -r 'if .contents then "aantal: \(.contents|length)" else . end' list.json | head -5

# Diagnose (alleen lezen) van de Twilio-webhooks: waarom een handtekening geweigerd wordt (403).
# Leest de logging (Application Insights); geen secrets of gastgegevens in de uitvoer.
name: Twilio diag
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [prd, tst]
        default: prd
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          rg="rg-checkin-${{ inputs.environment }}"
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true >/dev/null 2>&1
          app=$(az resource list -g "$rg" --resource-type Microsoft.Insights/components --query "[0].name" -o tsv)
          echo "== Application Insights: $app"
          echo "== Meldingen met 'Twilio' (laatste 3 uur)"
          az monitor app-insights query -g "$rg" --app "$app" -o tsv --offset 3h --analytics-query \
            "traces | where timestamp > ago(3h) | where message has 'Twilio' | project timestamp, message | order by timestamp desc | take 20" \
            --query "tables[0].rows[]" || true
          echo "== Aanvragen op /api/twilio (laatste 3 uur)"
          az monitor app-insights query -g "$rg" --app "$app" -o tsv --offset 3h --analytics-query \
            "requests | where timestamp > ago(3h) | where url has '/api/twilio' | project timestamp, url, resultCode | order by timestamp desc | take 20" \
            --query "tables[0].rows[]" || true
          echo "== Alle aanvragen per naam en code (laatste 3 uur)"
          az monitor app-insights query -g "$rg" --app "$app" -o tsv --offset 3h --analytics-query \
            "requests | where timestamp > ago(3h) | summarize n=count() by name, resultCode | order by n desc | take 30" \
            --query "tables[0].rows[]" || true
          echo "== Testaanvraag zonder geldige handtekening (verwacht 403 van onze code)"
          curl -s -o /dev/null -w "%{http_code}\n" -X POST -d "CallSid=CAtest" "https://${{ inputs.environment == 'prd' && 'monitor.hotellucca.be' || 'monitor-tst.hotellucca.be' }}/api/twilio/voice?h=lucca" || true
          sleep 90
          echo "== Uitvoeringen en weigeringen (laatste 30 minuten)"
          az monitor app-insights query -g "$rg" --app "$app" -o tsv --offset 1h --analytics-query \
            "traces | where timestamp > ago(30m) | where message has 'handtekening' or message has 'twilio_voice' or message has 'AUTH_TOKEN' | project timestamp, severityLevel, message | order by timestamp desc | take 30" \
            --query "tables[0].rows[]" || true
          echo "== Twilio-sleutels in Key Vault tegen de Twilio-API (alleen de HTTP-code)"
          kv=$(az keyvault list -g "$rg" --query "[?!contains(name,'sess')].name | [0]" -o tsv)
          echo "Key Vault: $kv"
          for p in lucca- ""; do
            sid=$(az keyvault secret show --vault-name "$kv" -n "${p}twilio-account-sid" --query value -o tsv 2>/dev/null || true)
            tok=$(az keyvault secret show --vault-name "$kv" -n "${p}twilio-auth-token" --query value -o tsv 2>/dev/null || true)
            [ -n "$tok" ] && echo "::add-mask::$tok"
            echo "secret ${p}twilio-account-sid: ${sid:+aanwezig (${sid:0:6}...)}  ${p}twilio-auth-token: ${tok:+aanwezig}"
            if [ -n "$sid" ] && [ -n "$tok" ]; then
              curl -s -o /dev/null -w "Twilio API met ${p}sleutels: %{http_code}\n" -u "$sid:$tok" "https://api.twilio.com/2010-04-01/Accounts/$sid.json"
            fi
          done
          echo "== Fouten (laatste 30 minuten)"
          az monitor app-insights query -g "$rg" --app "$app" -o tsv --offset 1h --analytics-query \
            "union exceptions, (traces | where severityLevel >= 3) | where timestamp > ago(30m) | project timestamp, problemId, outerMessage, message | order by timestamp desc | take 15" \
            --query "tables[0].rows[]" || true

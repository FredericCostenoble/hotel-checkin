# Diagnose (alleen lezen) van de Twilio-webhooks: waarom een handtekening geweigerd wordt (403).
# Leest de logging (Application Insights); geen secrets of gastgegevens in de uitvoer.
name: Twilio diag
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [prd, tst]
        default: prd
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          rg="rg-checkin-${{ inputs.environment }}"
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true >/dev/null 2>&1
          app=$(az resource list -g "$rg" --resource-type Microsoft.Insights/components --query "[0].name" -o tsv)
          echo "== Application Insights: $app"
          echo "== Meldingen met 'Twilio' (laatste 3 uur)"
          az monitor app-insights query -g "$rg" --app "$app" -o tsv --analytics-query \
            "traces | where timestamp > ago(3h) | where message has 'Twilio' | project timestamp, message | order by timestamp desc | take 20" \
            --query "tables[0].rows[]" || true
          echo "== Aanvragen op /api/twilio (laatste 3 uur)"
          az monitor app-insights query -g "$rg" --app "$app" -o tsv --analytics-query \
            "requests | where timestamp > ago(3h) | where url has '/api/twilio' | project timestamp, url, resultCode | order by timestamp desc | take 20" \
            --query "tables[0].rows[]" || true

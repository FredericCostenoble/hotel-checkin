# Diagnose (alleen lezen) van de gastprofielen; geen namen of adressen in de log.
name: Diag
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [prd, tst]
        default: prd
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[storage]'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          export STORAGE_TABLE_ENDPOINT=$(az storage account list -g "rg-checkin-${{ inputs.environment }}" --query "[0].primaryEndpoints.table" -o tsv)
          python -m hotel_checkin.admin.guest_diag lucca

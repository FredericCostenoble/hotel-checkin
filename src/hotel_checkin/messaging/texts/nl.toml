[[modules.practical_info]]
type = "list"
titel = "Tijdens uw verblijf"
items = [
  "Ontbijt: elke dag van {ontbijt_van} tot {ontbijt_tot} in onze 14de-eeuwse gewelfde kelder.",
  "Wifi: {wifi_naam}, wachtwoord {wifi_wachtwoord}",
  "Parkeren: het hotel heeft geen eigen parking. Parking {parking_naam} ligt op {parking_minuten} minuten wandelen.",
]

[[modules.practical_info]]
type = "text"
titel = "Vertrek"
alineas = ["Uitchecken kan tot {checkout_tot}. U kunt uw bagage gratis bij ons achterlaten."]

[[modules.pay_open_amount]]
type = "text"
titel = "Betalen"
alineas = ["Voor uw verblijf staat nog {openstaand_bedrag} open. U kunt dit nu al veilig online betalen, dan hoeft u er bij aankomst niet meer aan te denken."]

[[modules.pay_open_amount]]
type = "prices"
totaal = "Totaal"
betaald = "Al betaald"
open = "Nog te betalen"

[[modules.pay_open_amount]]
type = "button"
tekst = "Nu betalen ({openstaand_bedrag})"
link = "{betaal_link}"

[[modules.pay_city_tax]]
type = "text"
titel = "Toeristenbelasting"
alineas = ["De stad Brugge heft een toeristenbelasting van {toeristenbelasting_tarief}. Voor uw verblijf is dat {toeristenbelasting}. Die zit niet in de prijs die u via {kanaal} betaalde. U kunt ze nu al veilig online betalen."]

[[modules.pay_city_tax]]
type = "button"
tekst = "Toeristenbelasting betalen ({toeristenbelasting})"
link = "{betaal_link}"

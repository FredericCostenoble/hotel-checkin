# Teksten van de berichten aan gasten, Nederlands.
# Velden tussen { } worden automatisch ingevuld (gastgegevens of instellingen uit config/hotels/<hotel_id>.toml).
# Bloktypes: text (alinea's), details (tabel), highlight (opvallend vak), list (opsomming), button.

[algemeen]
# Wifi in de praktische info ({wifi_regel}): per kamer een eigen netwerk (QR-code) of één netwerk voor iedereen,
# volgens [wifi] per_kamer in het hotelbestand
wifi_per_kamer = "Wifi: elke kamer heeft een eigen, privé wifinetwerk. Scan de QR-code op uw kamer om te verbinden."
wifi_gedeeld = "Wifi: {wifi_naam}, wachtwoord {wifi_wachtwoord}"
# Meer kamers: één code per kamer (code-mail)
codes_titel = "Uw persoonlijke pincodes"
codes_uitleg = "Elke code opent de voordeur en die kamer, van {code_geldig_van} tot {code_geldig_tot}. Druk na de code altijd op de pijltoets ↵."
kamer_code = "Kamer {kamer}, {wat}"   # {wat} = verdieping of naam van de kamer
verdieping = "{n}e verdieping"
verdieping_kort = "verdiep {n}"
eigen_ingang = "Let op, eigen ingang"   # titel boven de uitleg voor een kamer met een eigen ingang
meerdere_kamers = "{aantal} kamers: {kamers}"   # kamer in de reservatiegegevens bij meer dan één kamer
team = "Het team van {hotel_naam}"
voettekst = "U ontvangt deze mail omdat u een reservatie hebt bij {hotel_naam}."

[confirmation]
onderwerp = "Uw verblijf in {hotel_naam}, {aankomst} tot {vertrek}"
voorvertoning = "Bedankt voor uw reservatie. Doe uw online check-in op uw verblijfspagina."
aanhef = "Beste {voornaam},"
afsluiting = "Tot binnenkort,"
sms = "{hotel_naam}: beste {voornaam}, bedankt voor uw reservatie. Doe uw online check-in op uw verblijfspagina, daar vindt u later ook uw pincode: {checkin_link}"

[[confirmation.blokken]]
type = "text"
alineas = ["Hartelijk dank voor uw reservatie in {hotel_naam}. We kijken ernaar uit u te verwelkomen in hartje Brugge."]

[[confirmation.blokken]]
module = "reservation"
type = "details"
titel = "Uw reservatie"
rijen = [["Aankomst", "{aankomst}"], ["Vertrek", "{vertrek}"], ["Kamer", "{kamertype}"], ["Reservatienummer", "{reservatienummer}"]]

[[confirmation.blokken]]
module = "checkin_form"
type = "text"
titel = "Uw verblijfspagina"
alineas = ["Alles voor uw verblijf staat op één persoonlijke pagina. Begin daar met uw online check-in, het duurt maar een paar minuten. Daarna vindt u er wat er nog te betalen is, uw pincode voor de voordeur en uw kamer, en tijdens uw verblijf opent u er de deuren."]

[[confirmation.blokken]]
module = "checkin_form"
type = "button"
tekst = "Naar uw verblijfspagina"
link = "{checkin_link}"

[[confirmation.blokken]]
type = "text"
alineas = ["Onze receptie is elke dag open van {receptie_van} tot {receptie_tot}."]

[reminder]
onderwerp = "Nog een week tot uw verblijf in {hotel_naam}"
voorvertoning = "Doe uw online check-in en ontvang uw persoonlijke pincode."
aanhef = "Beste {voornaam},"
afsluiting = "Tot volgende week,"
sms = "{hotel_naam}: beste {voornaam}, over een week bent u onze gast. Doe nu uw online check-in op uw verblijfspagina: {checkin_link}"

[[reminder.blokken]]
type = "text"
alineas = ["Over een week bent u welkom in {hotel_naam}. Uw online check-in is nog niet gedaan."]

[[reminder.blokken]]
module = "reservation"
type = "details"
titel = "Uw reservatie"
rijen = [["Aankomst", "{aankomst}"], ["Vertrek", "{vertrek}"], ["Reservatienummer", "{reservatienummer}"]]

[[reminder.blokken]]
module = "checkin_form"
type = "text"
alineas = ["Doe hem nu op uw verblijfspagina, het duurt maar een paar minuten. Daarna ontvangt u voor uw aankomst uw persoonlijke pincode."]

[[reminder.blokken]]
module = "checkin_form"
type = "button"
tekst = "Online check-in doen"
link = "{checkin_link}"

[access_code]
onderwerp = "Uw pincode en praktische info voor {hotel_naam}"
voorvertoning = "Uw persoonlijke pincode en alles wat u nodig hebt voor uw verblijf."
aanhef = "Beste {voornaam},"
afsluiting = "Tot binnenkort,"
sms = "{hotel_naam}: beste {voornaam}, tot binnenkort! Uw pincode voor de voordeur en kamer {kamernummer}: {pincode}, daarna de pijltoets. Geldig van {code_geldig_van} tot {code_geldig_tot}. Alle info staat in uw mail."
# Sms en WhatsApp met de code: één bericht per kamer
sms_kamer = "Uw verblijf @ {hotel_naam}, kamer {kamer_kort}, code: {pincode} ↵"

[[access_code.blokken]]
type = "text"
alineas = ["Uw verblijf komt eraan. Hieronder vindt u uw persoonlijke pincode."]

[[access_code.blokken]]
module = "code"
type = "highlight"
titel = "Uw persoonlijke pincode"
waarde = "{pincode} ↵"
alineas = ["Met deze code opent u de voordeur en uw kamerdeur, van {code_geldig_van} tot {code_geldig_tot}.", "Druk na de code altijd op de pijltoets ↵.", "Uw kamer: {kamernummer}"]

[[access_code.blokken]]
module = "practical_info"
type = "list"
titel = "Aankomen"
items = [
  "Adres: {hotel_adres}",
  "Inchecken kan vanaf {receptie_van}. De receptie is open tot {receptie_tot}. Komt u later aan, dan gaat u met uw pincode rechtstreeks naar uw kamer.",
  "Toets uw pincode in op het klavier van de voordeur en druk daarna op de pijltoets ↵. Doe hetzelfde aan uw kamerdeur.",
  "Ons hotel heeft geen lift. Wie hulp nodig heeft met de bagage, kan terecht aan de receptie.",
  "Parkeren: het hotel heeft geen eigen parking. Parking {parking_naam} ligt op {parking_minuten} minuten wandelen.",
]

[[access_code.blokken]]
module = "practical_info"
type = "text"
titel = "Vertrek"
alineas = ["Uitchecken kan tot {checkout_tot}. U kunt uw bagage gratis bij ons achterlaten. Uw code opent de voordeur nog tot {checkout_voordeur_tot} die dag, bv. om uw bagage op te halen."]

[[access_code.blokken]]
module = "practical_info"
type = "text"
alineas = ["Ontbijt, wifi en alles over uw verblijf vindt u op uw verblijfspagina. Tijdens uw verblijf opent u daar ook de voordeur en uw kamer."]

[[access_code.blokken]]
type = "button"
tekst = "Bekijk uw verblijf"
link = "{checkin_link}"

[[access_code.blokken]]
type = "text"
alineas = ["Deel deze mail en de link naar uw verblijfspagina alleen met wie bij u verblijft: met uw pincode en die pagina kan men uw kamer openen."]

[[access_code.blokken]]
type = "text"
alineas = ["Hebt u een vraag? Bel ons op {hotel_telefoon} of antwoord gewoon op deze mail."]

[at_the_door]
sms = "{hotel_naam}: welkom, {voornaam}! Toets {pincode} en daarna de pijltoets op het klavier van de ingang en van kamer {kamernummer}. Problemen? Bel {nood_nummer}."


[room_change]
# Kamerwissel na de code-mail (bv. probleem in de badkamer): zelfde code, andere kamer
onderwerp = "Uw kamer in {hotel_naam} is gewijzigd"
voorvertoning = "Nieuwe kamer, zelfde pincode."
aanhef = "Beste {voornaam},"
afsluiting = "Hartelijke groeten,"
sms = "{hotel_naam}: uw kamer is gewijzigd, u verblijft nu in kamer {kamer_kort}. Uw code blijft {pincode} ↵"

[[room_change.blokken]]
type = "text"
alineas = ["Uw kamer is gewijzigd: u verblijft nu in {nieuwe_kamer}, in plaats van kamer {oude_kamer}.", "Uw pincode blijft dezelfde: {pincode} ↵. Ze opent nu de deur van uw nieuwe kamer."]

[[room_change.blokken]]   # alleen als de nieuwe kamer een eigen ingang heeft ([kamers.<nummer>] toegang_...)
type = "text"
alleen_als = "toegang"
titel = "{eigen_ingang_titel}"
alineas = ["{toegang}"]

[[room_change.blokken]]
type = "text"
alineas = ["Hebt u vragen, bel ons gerust op {hotel_telefoon}."]

[thank_you]
onderwerp = "Bedankt voor uw verblijf in {hotel_naam}"
voorvertoning = "Bedankt en graag tot een volgende keer."
aanhef = "Beste {voornaam},"
afsluiting = "Hartelijke groeten,"
sms = "{hotel_naam}: beste {voornaam}, bedankt voor uw verblijf. Graag tot een volgende keer!"

[[thank_you.blokken]]
type = "text"
alineas = ["Hartelijk dank voor uw verblijf in {hotel_naam}. We hopen dat u genoten hebt van Brugge en van uw kamer.", "We verwelkomen u graag opnieuw. Boekt u rechtstreeks via onze website, dan bent u zeker van de beste prijs."]

[[thank_you.blokken]]   # onderdeel betaalknop (tabblad Workflow): alleen als er na vertrek nog iets openstaat
module = "pay"
type = "text"
titel = "Betalen"
alineas = ["Bij het nakijken van uw rekening zagen we dat er nog {openstaand_bedrag} openstaat. U kunt dit hieronder veilig online betalen."]

[[thank_you.blokken]]
module = "pay"
type = "prices"
totaal = "Totaal"
betaald = "Al betaald"
open = "Nog te betalen"

[[thank_you.blokken]]
module = "pay"
type = "button"
tekst = "Nu betalen ({openstaand_bedrag})"
link = "{betaal_link}"

[[thank_you.blokken]]
module = "pay"
type = "text"
alineas = ["Hebt u een vraag over de rekening? Antwoord gewoon op deze mail of bel ons op {hotel_telefoon}."]

[[thank_you.blokken]]   # review vragen; alleen als het adres ingevuld is (Instellingen > Hotel > Reviews)
type = "text"
titel = "Uw mening"
alineas = ["Was u tevreden? Een korte review helpt ons enorm en helpt andere reizigers kiezen. Het duurt maar een minuut."]
alleen_als = "reviews_google_url"

[[thank_you.blokken]]
type = "button"
tekst = "Schrijf een review op Google"
link = "{reviews_google_url}"
alleen_als = "reviews_google_url"

[[thank_you.blokken]]
type = "button"
tekst = "Of op een andere site"
link = "{reviews_other_url}"
alleen_als = "reviews_other_url"

[payment_request]
onderwerp = "Openstaand bedrag voor uw verblijf in {hotel_naam}"
voorvertoning = "Voor uw verblijf staat nog een bedrag open."
aanhef = "Beste {voornaam},"
afsluiting = "Hartelijke groeten,"
sms = "{hotel_naam}: beste {voornaam}, voor uw verblijf staat nog {openstaand_bedrag} open. Meer info in uw mail."

[[payment_request.blokken]]
type = "text"
alineas = ["Bedankt voor uw verblijf in {hotel_naam}. Bij het nakijken van uw rekening zagen we dat er nog een bedrag openstaat."]

[[payment_request.blokken]]
type = "text"
alineas = ["Hebt u een vraag over de rekening? Antwoord gewoon op deze mail of bel ons op {hotel_telefoon}."]


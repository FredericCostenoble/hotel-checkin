# Teksten van de berichten aan gasten, Nederlands.
# Velden tussen { } worden automatisch ingevuld (gastgegevens of instellingen uit config/hotels/<hotel_id>.toml).
# Bloktypes: text (alinea's), details (tabel), highlight (opvallend vak), list (opsomming), button.

[algemeen]
meerdere_kamers = "{aantal} kamers: {kamers}"   # kamer in de reservatiegegevens bij meer dan één kamer
team = "Het team van {hotel_naam}"
voettekst = "U ontvangt deze mail omdat u een reservatie hebt bij {hotel_naam}."

[confirmation]
onderwerp = "Uw verblijf in {hotel_naam}, {aankomst} tot {vertrek}"
voorvertoning = "Bedankt voor uw reservatie. Vul uw check-in-gegevens aan."
aanhef = "Beste {voornaam},"
afsluiting = "Tot binnenkort,"
sms = "{hotel_naam}: beste {voornaam}, bedankt voor uw reservatie. Vul uw check-in-gegevens aan en ontvang voor aankomst uw persoonlijke pincode: {checkin_link}"

[[confirmation.blokken]]
type = "text"
alineas = ["Hartelijk dank voor uw reservatie in {hotel_naam}. We kijken ernaar uit u te verwelkomen in hartje Brugge."]

[[confirmation.blokken]]
module = "reservation"
type = "details"
titel = "Uw reservatie"
rijen = [["Aankomst", "{aankomst}"], ["Vertrek", "{vertrek}"], ["Kamer", "{kamertype}"], ["Reservatienummer", "{reservatienummer}"]]

[[confirmation.blokken]]
module = "checkin_form"
type = "text"
titel = "Vlot inchecken"
alineas = ["Om uw aankomst zo vlot mogelijk te laten verlopen, vragen we u enkele gegevens aan te vullen. Een deel hebben we al voor u ingevuld. Het duurt maar een paar minuten."]

[[confirmation.blokken]]
module = "checkin_form"
type = "button"
tekst = "Check-in gegevens aanvullen"
link = "{checkin_link}"

[[confirmation.blokken]]
module = "checkin_form"
type = "text"
alineas = ["Via deze gegevens sturen we u voor uw aankomst alle praktische informatie, waaronder een persoonlijke pincode voor de voordeur en uw kamerdeur tijdens uw verblijf. Zo kunt u op elk moment binnen, ook buiten de openingsuren van de receptie."]

[[confirmation.blokken]]
type = "text"
alineas = ["Onze receptie is elke dag open van {receptie_van} tot {receptie_tot}. U bent er altijd welkom voor vragen of tips over Brugge."]

[reminder]
onderwerp = "Nog een week tot uw verblijf in {hotel_naam}"
voorvertoning = "Vul uw check-in-gegevens aan en ontvang uw persoonlijke pincode."
aanhef = "Beste {voornaam},"
afsluiting = "Tot volgende week,"
sms = "{hotel_naam}: beste {voornaam}, over een week bent u onze gast. Vul uw check-in-gegevens aan en ontvang uw persoonlijke pincode: {checkin_link}"

[[reminder.blokken]]
type = "text"
alineas = ["Over een week bent u welkom in {hotel_naam}. We merkten dat uw check-in-gegevens nog niet volledig zijn."]

[[reminder.blokken]]
module = "reservation"
type = "details"
titel = "Uw reservatie"
rijen = [["Aankomst", "{aankomst}"], ["Vertrek", "{vertrek}"], ["Reservatienummer", "{reservatienummer}"]]

[[reminder.blokken]]
module = "checkin_form"
type = "text"
alineas = ["Vul ze nu in, dan krijgt u voor uw aankomst alle praktische informatie en uw persoonlijke pincode voor de voordeur en uw kamerdeur. Het duurt maar een paar minuten."]

[[reminder.blokken]]
module = "checkin_form"
type = "button"
tekst = "Check-in gegevens aanvullen"
link = "{checkin_link}"

[[reminder.blokken]]
type = "text"
alineas = ["Onze receptie is elke dag open van {receptie_van} tot {receptie_tot}."]

[access_code]
onderwerp = "Uw pincode en praktische info voor {hotel_naam}"
voorvertoning = "Uw persoonlijke pincode en alles wat u nodig hebt voor uw verblijf."
aanhef = "Beste {voornaam},"
afsluiting = "Tot binnenkort,"
sms = "{hotel_naam}: beste {voornaam}, tot binnenkort! Uw pincode voor de voordeur en kamer {kamernummer}: {pincode}, daarna de pijltoets. Geldig van {code_geldig_van} tot {code_geldig_tot}. Alle info staat in uw mail."

[[access_code.blokken]]
type = "text"
alineas = ["Uw verblijf komt eraan. Hieronder vindt u alles wat u nodig hebt voor uw verblijf."]

[[access_code.blokken]]
module = "code"
type = "highlight"
titel = "Uw persoonlijke pincode"
waarde = "{pincode}"
alineas = ["Met deze code opent u de voordeur en uw kamerdeur, van {code_geldig_van} tot {code_geldig_tot}.", "Druk na de code altijd op de pijltoets ↵.", "Uw kamer: {kamernummer}"]

[[access_code.blokken]]
module = "practical_info"
type = "list"
titel = "Aankomen"
items = [
  "Adres: {hotel_adres}",
  "Inchecken kan vanaf {receptie_van}. De receptie is open tot {receptie_tot}. Komt u later aan, dan gaat u met uw pincode rechtstreeks naar uw kamer.",
  "Toets uw pincode in op het klavier van de voordeur en druk daarna op de pijltoets ↵. Doe hetzelfde aan uw kamerdeur.",
  "Ons hotel heeft geen lift. Wie hulp nodig heeft met de bagage, kan terecht aan de receptie.",
]

[[access_code.blokken]]
module = "practical_info"
type = "list"
titel = "Tijdens uw verblijf"
items = [
  "Ontbijt: elke dag van {ontbijt_van} tot {ontbijt_tot} in onze 14de-eeuwse gewelfde kelder.",
  "Wifi: {wifi_naam}, wachtwoord {wifi_wachtwoord}",
  "Parkeren: het hotel heeft geen eigen parking. Parking {parking_naam} ligt op {parking_minuten} minuten wandelen.",
]

[[access_code.blokken]]
module = "practical_info"
type = "text"
titel = "Vertrek"
alineas = ["Uitchecken kan tot {checkout_tot}. U kunt uw bagage gratis bij ons achterlaten."]

[[access_code.blokken]]
type = "text"
alineas = ["Hebt u een vraag? Bel ons op {hotel_telefoon} of antwoord gewoon op deze mail."]

[at_the_door]
sms = "{hotel_naam}: welkom, {voornaam}! Toets {pincode} en daarna de pijltoets, eerst aan de voordeur en dan aan kamer {kamernummer}. Problemen? Bel {nood_nummer}."

[thank_you]
onderwerp = "Bedankt voor uw verblijf in {hotel_naam}"
voorvertoning = "Bedankt en graag tot een volgende keer."
aanhef = "Beste {voornaam},"
afsluiting = "Hartelijke groeten,"
sms = "{hotel_naam}: beste {voornaam}, bedankt voor uw verblijf. Graag tot een volgende keer!"

[[thank_you.blokken]]
type = "text"
alineas = ["Hartelijk dank voor uw verblijf in {hotel_naam}. We hopen dat u genoten hebt van Brugge en van uw kamer.", "We verwelkomen u graag opnieuw. Boekt u rechtstreeks via onze website, dan bent u zeker van de beste prijs."]

[payment_request]
onderwerp = "Openstaand bedrag voor uw verblijf in {hotel_naam}"
voorvertoning = "Voor uw verblijf staat nog een bedrag open."
aanhef = "Beste {voornaam},"
afsluiting = "Hartelijke groeten,"
sms = "{hotel_naam}: beste {voornaam}, voor uw verblijf staat nog {openstaand_bedrag} open. Meer info in uw mail."

[[payment_request.blokken]]
type = "text"
alineas = ["Bedankt voor uw verblijf in {hotel_naam}. Bij het nakijken van uw rekening zagen we dat er nog een bedrag openstaat."]

[[payment_request.blokken]]
type = "text"
alineas = ["Hebt u een vraag over de rekening? Antwoord gewoon op deze mail of bel ons op {hotel_telefoon}."]

# Bouwstenen die een stap kan meekrijgen als ze niet in de eigen tekst staan (tabblad Workflow,
# inhoud van de mail). module = ... in een blok hierboven: dat blok hoort bij die bouwsteen.

[[modules.reservation]]
type = "details"
titel = "Uw reservatie"
rijen = [[
  "Aankomst",
  "{aankomst}",
], [
  "Vertrek",
  "{vertrek}",
], [
  "Kamer",
  "{kamertype}",
], [
  "Reservatienummer",
  "{reservatienummer}",
]]

[[modules.checkin_form]]

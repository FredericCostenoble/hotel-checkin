# Texte der Nachrichten an Gäste, Deutsch. Gleiche Struktur wie nl.toml.

[algemeen]
meerdere_kamers = "{aantal} Zimmer: {kamers}"   # kamer in de reservatiegegevens bij meer dan één kamer
team = "Ihr Team vom {hotel_naam}"
voettekst = "Sie erhalten diese E-Mail, weil Sie eine Reservierung im {hotel_naam} haben."

[confirmation]
onderwerp = "Ihr Aufenthalt im {hotel_naam}, {aankomst} bis {vertrek}"
voorvertoning = "Vielen Dank für Ihre Reservierung. Bitte ergänzen Sie Ihre Check-in-Daten."
aanhef = "Guten Tag {voornaam} {achternaam},"
afsluiting = "Bis bald,"
sms = "{hotel_naam}: Vielen Dank für Ihre Reservierung, {voornaam}. Ergänzen Sie Ihre Check-in-Daten und erhalten Sie vor der Anreise Ihren persönlichen PIN-Code: {checkin_link}"

[[confirmation.blokken]]
type = "text"
alineas = ["Vielen Dank für Ihre Reservierung im {hotel_naam}. Wir freuen uns, Sie im Herzen von Brügge begrüßen zu dürfen."]

[[confirmation.blokken]]
module = "reservation"
type = "details"
titel = "Ihre Reservierung"
rijen = [["Anreise", "{aankomst}"], ["Abreise", "{vertrek}"], ["Zimmer", "{kamertype}"], ["Reservierungsnummer", "{reservatienummer}"]]

[[confirmation.blokken]]
module = "checkin_form"
type = "text"
titel = "Einfacher Check-in"
alineas = ["Damit Ihre Anreise so reibungslos wie möglich verläuft, bitten wir Sie, einige Angaben zu ergänzen. Einen Teil haben wir bereits für Sie ausgefüllt. Es dauert nur wenige Minuten."]

[[confirmation.blokken]]
module = "checkin_form"
type = "button"
tekst = "Check-in-Daten ergänzen"
link = "{checkin_link}"

[[confirmation.blokken]]
module = "checkin_form"
type = "text"
alineas = ["Mit diesen Angaben senden wir Ihnen vor Ihrer Anreise alle praktischen Informationen, darunter einen persönlichen PIN-Code für die Haustür und Ihre Zimmertür während Ihres Aufenthalts. So kommen Sie jederzeit herein, auch außerhalb der Öffnungszeiten der Rezeption."]

[[confirmation.blokken]]
type = "text"
alineas = ["Unsere Rezeption ist täglich von {receptie_van} bis {receptie_tot} Uhr geöffnet. Sie sind dort jederzeit willkommen, mit Fragen oder für Tipps zu Brügge."]

[reminder]
onderwerp = "Noch eine Woche bis zu Ihrem Aufenthalt im {hotel_naam}"
voorvertoning = "Ergänzen Sie Ihre Check-in-Daten und erhalten Sie Ihren persönlichen PIN-Code."
aanhef = "Guten Tag {voornaam} {achternaam},"
afsluiting = "Bis nächste Woche,"
sms = "{hotel_naam}: {voornaam}, in einer Woche sind Sie unser Gast. Ergänzen Sie Ihre Check-in-Daten und erhalten Sie Ihren persönlichen PIN-Code: {checkin_link}"

[[reminder.blokken]]
type = "text"
alineas = ["In einer Woche dürfen wir Sie im {hotel_naam} begrüßen. Uns ist aufgefallen, dass Ihre Check-in-Daten noch nicht vollständig sind."]

[[reminder.blokken]]
module = "reservation"
type = "details"
titel = "Ihre Reservierung"
rijen = [["Anreise", "{aankomst}"], ["Abreise", "{vertrek}"], ["Reservierungsnummer", "{reservatienummer}"]]

[[reminder.blokken]]
module = "checkin_form"
type = "text"
alineas = ["Ergänzen Sie diese jetzt, dann erhalten Sie vor Ihrer Anreise alle praktischen Informationen und Ihren persönlichen PIN-Code für die Haustür und Ihre Zimmertür. Es dauert nur wenige Minuten."]

[[reminder.blokken]]
module = "checkin_form"
type = "button"
tekst = "Check-in-Daten ergänzen"
link = "{checkin_link}"

[[reminder.blokken]]
type = "text"
alineas = ["Unsere Rezeption ist täglich von {receptie_van} bis {receptie_tot} Uhr geöffnet."]

[access_code]
onderwerp = "Ihr PIN-Code und praktische Informationen für das {hotel_naam}"
voorvertoning = "Ihr persönlicher PIN-Code und alles, was Sie für Ihren Aufenthalt brauchen."
aanhef = "Guten Tag {voornaam} {achternaam},"
afsluiting = "Bis bald,"
sms = "{hotel_naam}: bis bald, {voornaam}! Ihr PIN-Code für die Haustür und Zimmer {kamernummer}: {pincode}, danach die Pfeiltaste. Gültig von {code_geldig_van} bis {code_geldig_tot}. Alle Informationen finden Sie in Ihrer E-Mail."

[[access_code.blokken]]
type = "text"
alineas = ["Ihr Aufenthalt steht bevor. Unten finden Sie alles, was Sie für Ihren Aufenthalt brauchen."]

[[access_code.blokken]]
module = "code"
type = "highlight"
titel = "Ihr persönlicher PIN-Code"
waarde = "{pincode}"
alineas = ["Mit diesem Code öffnen Sie die Haustür und Ihre Zimmertür, von {code_geldig_van} bis {code_geldig_tot}.", "Drücken Sie nach dem Code immer die Pfeiltaste ↵.", "Ihr Zimmer: {kamernummer}"]

[[access_code.blokken]]
module = "practical_info"
type = "list"
titel = "Anreise"
items = [
  "Adresse: {hotel_adres}",
  "Der Check-in ist ab {receptie_van} Uhr möglich. Die Rezeption ist bis {receptie_tot} Uhr geöffnet. Wenn Sie später ankommen, gehen Sie mit Ihrem PIN-Code direkt zu Ihrem Zimmer.",
  "Geben Sie Ihren PIN-Code am Tastenfeld der Haustür ein und drücken Sie danach die Pfeiltaste ↵. Machen Sie es an Ihrer Zimmertür genauso.",
  "Unser Hotel hat keinen Aufzug. Wenn Sie Hilfe mit Ihrem Gepäck brauchen, wenden Sie sich bitte an die Rezeption.",
]

[[access_code.blokken]]
module = "practical_info"
type = "list"
titel = "Während Ihres Aufenthalts"
items = [
  "Frühstück: täglich von {ontbijt_van} bis {ontbijt_tot} Uhr in unserem Gewölbekeller aus dem 14. Jahrhundert.",
  "WLAN: {wifi_naam}, Passwort {wifi_wachtwoord}",
  "Parken: Das Hotel hat keinen eigenen Parkplatz. Das Parkhaus {parking_naam} liegt {parking_minuten} Gehminuten entfernt.",
]

[[access_code.blokken]]
module = "practical_info"
type = "text"
titel = "Abreise"
alineas = ["Der Check-out ist bis {checkout_tot} Uhr möglich. Ihr Gepäck können Sie kostenlos bei uns lassen."]

[[access_code.blokken]]
type = "text"
alineas = ["Haben Sie Fragen? Rufen Sie uns unter {hotel_telefoon} an oder antworten Sie einfach auf diese E-Mail."]

[at_the_door]
sms = "{hotel_naam}: Willkommen, {voornaam}! Geben Sie {pincode} und danach die Pfeiltaste ein, zuerst an der Haustür, dann an Zimmer {kamernummer}. Probleme? Rufen Sie {nood_nummer} an."

[thank_you]
onderwerp = "Vielen Dank für Ihren Aufenthalt im {hotel_naam}"
voorvertoning = "Vielen Dank und bis zum nächsten Mal."
aanhef = "Guten Tag {voornaam},"
afsluiting = "Mit freundlichen Grüßen,"
sms = "{hotel_naam}: Guten Tag {voornaam}, vielen Dank für Ihren Aufenthalt. Bis zum nächsten Mal!"

[[thank_you.blokken]]
type = "text"
alineas = ["Vielen Dank für Ihren Aufenthalt im {hotel_naam}. Wir hoffen, Sie haben Brügge und Ihr Zimmer genossen.", "Wir freuen uns, Sie wieder begrüßen zu dürfen. Wenn Sie direkt über unsere Website buchen, erhalten Sie garantiert den besten Preis."]

[[thank_you.blokken]]   # review vragen; alleen als het adres ingevuld is (Instellingen > Hotel > Reviews)
type = "text"
titel = "Ihre Meinung"
alineas = ["Waren Sie zufrieden? Eine kurze Bewertung hilft uns sehr und hilft anderen Reisenden bei der Wahl. Es dauert nur eine Minute."]
alleen_als = "reviews_google_url"

[[thank_you.blokken]]
type = "button"
tekst = "Bewertung auf Google schreiben"
link = "{reviews_google_url}"
alleen_als = "reviews_google_url"

[[thank_you.blokken]]
type = "button"
tekst = "Oder auf einer anderen Seite"
link = "{reviews_other_url}"
alleen_als = "reviews_other_url"

[payment_request]
onderwerp = "Offener Betrag für Ihren Aufenthalt im {hotel_naam}"
voorvertoning = "Für Ihren Aufenthalt ist noch ein Betrag offen."
aanhef = "Guten Tag {voornaam},"
afsluiting = "Mit freundlichen Grüßen,"
sms = "{hotel_naam}: Guten Tag {voornaam}, für Ihren Aufenthalt sind noch {openstaand_bedrag} offen. Mehr dazu in Ihrer E-Mail."

[[payment_request.blokken]]
type = "text"
alineas = ["Vielen Dank für Ihren Aufenthalt im {hotel_naam}. Bei der Kontrolle Ihrer Rechnung haben wir festgestellt, dass noch ein Betrag offen ist."]

[[payment_request.blokken]]
type = "text"
alineas = ["Haben Sie eine Frage zur Rechnung? Antworten Sie einfach auf diese E-Mail oder rufen Sie uns an unter {hotel_telefoon}."]

# Bouwstenen die een stap kan meekrijgen als ze niet in de eigen tekst staan (tabblad Workflow,

[[modules.pay_city_tax]]
type = "button"
tekst = "Kurtaxe bezahlen ({toeristenbelasting})"
link = "{betaal_link}"


[incoming]
# Automatisch antwoord als een gast een WhatsApp of sms terugstuurt naar het nummer van de automatische berichten
# (processes/incoming.py). Het bericht zelf gaat per mail naar het hotel ([twilio] doorsturen).
antwoord = "{hotel_naam}: Diese Nummer sendet nur automatische Nachrichten. Ihre Nachricht wurde an die Rezeption weitergeleitet. Schneller erreichen Sie uns per WhatsApp unter {twilio_contact_whatsapp} oder telefonisch unter {hotel_telefoon}."

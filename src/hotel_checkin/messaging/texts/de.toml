alineas = ["Für Ihren Aufenthalt ist noch ein Betrag von {openstaand_bedrag} offen. Sie können ihn jetzt schon sicher online bezahlen, dann müssen Sie bei der Ankunft nicht mehr daran denken."]

[[modules.pay_open_amount]]
type = "prices"

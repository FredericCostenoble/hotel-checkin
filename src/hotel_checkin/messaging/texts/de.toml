# Texte der Nachrichten an Gäste, Deutsch. Gleiche Struktur wie nl.toml.

[algemeen]
# Wifi in de praktische info ({wifi_regel}): per kamer een eigen netwerk (QR-code) of één netwerk voor iedereen,
# volgens [wifi] per_kamer in het hotelbestand
wifi_per_kamer = "WLAN: Jedes Zimmer hat sein eigenes, privates WLAN. Scannen Sie den QR-Code in Ihrem Zimmer, um sich zu verbinden."
wifi_gedeeld = "WLAN: {wifi_naam}, Passwort {wifi_wachtwoord}"
# Meer kamers: één code per kamer (code-mail)
codes_titel = "Ihre persönlichen PIN-Codes"
codes_uitleg = "Jeder Code öffnet die Haustür und dieses Zimmer, von {code_geldig_van} bis {code_geldig_tot}. Drücken Sie nach dem Code immer die Pfeiltaste ↵."
kamer_code = "Zimmer {kamer}, {wat}"   # {wat} = verdieping of naam van de kamer
verdieping = "{n}. Etage"
verdieping_kort = "Etage {n}"
eigen_ingang = "Achtung, eigener Eingang"   # titel boven de uitleg voor een kamer met een eigen ingang
meerdere_kamers = "{aantal} Zimmer: {kamers}"   # kamer in de reservatiegegevens bij meer dan één kamer
team = "Ihr Team vom {hotel_naam}"
voettekst = "Sie erhalten diese E-Mail, weil Sie eine Reservierung im {hotel_naam} haben."

[confirmation]
onderwerp = "Ihr Aufenthalt im {hotel_naam}, {aankomst} bis {vertrek}"
voorvertoning = "Vielen Dank für Ihre Reservierung. Erledigen Sie Ihren Online-Check-in auf Ihrer Aufenthaltsseite."
aanhef = "Guten Tag {voornaam} {achternaam},"
afsluiting = "Bis bald,"
sms = "{hotel_naam}: Vielen Dank für Ihre Reservierung, {voornaam}. Erledigen Sie Ihren Online-Check-in auf Ihrer Aufenthaltsseite, dort finden Sie später auch Ihren PIN-Code: {checkin_link}"

[[confirmation.blokken]]
type = "text"
alineas = ["Vielen Dank für Ihre Reservierung im {hotel_naam}. Wir freuen uns, Sie im Herzen von Brügge begrüßen zu dürfen."]

[[confirmation.blokken]]
module = "reservation"
type = "details"
titel = "Ihre Reservierung"
rijen = [["Anreise", "{aankomst}"], ["Abreise", "{vertrek}"], ["Zimmer", "{kamertype}"], ["Reservierungsnummer", "{reservatienummer}"]]

[[confirmation.blokken]]
module = "checkin_form"
type = "text"
titel = "Ihre Aufenthaltsseite"
alineas = ["Alles für Ihren Aufenthalt steht auf einer persönlichen Seite. Beginnen Sie dort mit Ihrem Online-Check-in, das dauert nur wenige Minuten. Danach finden Sie dort, was noch zu bezahlen ist, Ihren PIN-Code für die Haustür und Ihr Zimmer, und während Ihres Aufenthalts öffnen Sie dort die Türen."]

[[confirmation.blokken]]
module = "checkin_form"
type = "button"
tekst = "Zu Ihrer Aufenthaltsseite"
link = "{checkin_link}"

[[confirmation.blokken]]
type = "text"
alineas = ["Unsere Rezeption ist täglich von {receptie_van} bis {receptie_tot} Uhr geöffnet."]

[reminder]
onderwerp = "Noch eine Woche bis zu Ihrem Aufenthalt im {hotel_naam}"
voorvertoning = "Erledigen Sie Ihren Online-Check-in und erhalten Sie Ihren persönlichen PIN-Code."
aanhef = "Guten Tag {voornaam} {achternaam},"
afsluiting = "Bis nächste Woche,"
sms = "{hotel_naam}: {voornaam}, in einer Woche sind Sie unser Gast. Erledigen Sie jetzt Ihren Online-Check-in auf Ihrer Aufenthaltsseite: {checkin_link}"

[[reminder.blokken]]
type = "text"
alineas = ["In einer Woche sind Sie im {hotel_naam} willkommen. Ihr Online-Check-in ist noch nicht erledigt."]

[[reminder.blokken]]
module = "reservation"
type = "details"
titel = "Ihre Reservierung"
rijen = [["Anreise", "{aankomst}"], ["Abreise", "{vertrek}"], ["Reservierungsnummer", "{reservatienummer}"]]

[[reminder.blokken]]
module = "checkin_form"
type = "text"
alineas = ["Erledigen Sie ihn jetzt auf Ihrer Aufenthaltsseite, das dauert nur wenige Minuten. Danach erhalten Sie vor Ihrer Anreise Ihren persönlichen PIN-Code."]

[[reminder.blokken]]
module = "checkin_form"
type = "button"
tekst = "Online-Check-in erledigen"
link = "{checkin_link}"

[access_code]
onderwerp = "Ihr PIN-Code und praktische Informationen für das {hotel_naam}"
voorvertoning = "Ihr persönlicher PIN-Code und alles, was Sie für Ihren Aufenthalt brauchen."
aanhef = "Guten Tag {voornaam} {achternaam},"
afsluiting = "Bis bald,"
sms = "{hotel_naam}: bis bald, {voornaam}! Ihr PIN-Code für die Haustür und Zimmer {kamernummer}: {pincode}, danach die Pfeiltaste. Gültig von {code_geldig_van} bis {code_geldig_tot}. Alle Informationen finden Sie in Ihrer E-Mail."
# Sms en WhatsApp met de code: één bericht per kamer
sms_kamer = "Ihr Aufenthalt @ {hotel_naam}, Zimmer {kamer_kort}, Code: {pincode} ↵"

[[access_code.blokken]]
type = "text"
alineas = ["Ihr Aufenthalt steht bevor. Unten finden Sie Ihren persönlichen PIN-Code."]

[[access_code.blokken]]
module = "code"
type = "highlight"
titel = "Ihr persönlicher PIN-Code"
waarde = "{pincode} ↵"
alineas = ["Mit diesem Code öffnen Sie die Haustür und Ihre Zimmertür, von {code_geldig_van} bis {code_geldig_tot}.", "Drücken Sie nach dem Code immer die Pfeiltaste ↵.", "Ihr Zimmer: {kamernummer}"]

[[access_code.blokken]]
module = "practical_info"
type = "list"
titel = "Anreise"
items = [
  "Adresse: {hotel_adres}",
  "Der Check-in ist ab {receptie_van} Uhr möglich. Die Rezeption ist bis {receptie_tot} Uhr geöffnet. Wenn Sie später ankommen, gehen Sie mit Ihrem PIN-Code direkt zu Ihrem Zimmer.",
  "Geben Sie Ihren PIN-Code am Tastenfeld der Haustür ein und drücken Sie danach die Pfeiltaste ↵. Machen Sie es an Ihrer Zimmertür genauso.",
  "Unser Hotel hat keinen Aufzug. Wenn Sie Hilfe mit Ihrem Gepäck brauchen, wenden Sie sich bitte an die Rezeption.",
  "Parken: Das Hotel hat keinen eigenen Parkplatz. Das Parkhaus {parking_naam} liegt {parking_minuten} Gehminuten entfernt.",
]

[[access_code.blokken]]
module = "practical_info"
type = "text"
alineas = ["Frühstück, WLAN, Abreise und alles zu Ihrem Aufenthalt finden Sie auf Ihrer Aufenthaltsseite. Während Ihres Aufenthalts öffnen Sie dort auch die Haustür und Ihr Zimmer."]

[[access_code.blokken]]
type = "button"
tekst = "Ihren Aufenthalt ansehen"
link = "{checkin_link}"

[[access_code.blokken]]
type = "text"
alineas = ["Haben Sie Fragen? Rufen Sie uns unter {hotel_telefoon} an oder antworten Sie einfach auf diese E-Mail."]

[at_the_door]
sms = "{hotel_naam}: Willkommen, {voornaam}! Geben Sie {pincode} und danach die Pfeiltaste am Tastenfeld des Eingangs und von Zimmer {kamernummer} ein. Probleme? Rufen Sie {nood_nummer} an."


[room_change]
# Kamerwissel na de code-mail (bv. probleem in de badkamer): zelfde code, andere kamer
onderwerp = "Ihr Zimmer im {hotel_naam} hat sich geändert"
voorvertoning = "Neues Zimmer, gleicher PIN-Code."
aanhef = "Guten Tag {voornaam},"
afsluiting = "Mit freundlichen Grüßen,"
sms = "{hotel_naam}: Ihr Zimmer hat sich geändert, Sie wohnen jetzt in Zimmer {kamer_kort}. Ihr Code bleibt {pincode} ↵"

[[room_change.blokken]]
type = "text"
alineas = ["Ihr Zimmer hat sich geändert: Sie wohnen jetzt in {nieuwe_kamer}, statt in Zimmer {oude_kamer}.", "Ihr PIN-Code bleibt gleich: {pincode} ↵. Er öffnet jetzt die Tür Ihres neuen Zimmers."]

[[room_change.blokken]]   # alleen als de nieuwe kamer een eigen ingang heeft ([kamers.<nummer>] toegang_...)
type = "text"
alleen_als = "toegang"
titel = "{eigen_ingang_titel}"
alineas = ["{toegang}"]

[[room_change.blokken]]
type = "text"
alineas = ["Bei Fragen rufen Sie uns gerne unter {hotel_telefoon} an."]

[thank_you]
onderwerp = "Vielen Dank für Ihren Aufenthalt im {hotel_naam}"
voorvertoning = "Vielen Dank und bis zum nächsten Mal."
aanhef = "Guten Tag {voornaam},"
afsluiting = "Mit freundlichen Grüßen,"
sms = "{hotel_naam}: Guten Tag {voornaam}, vielen Dank für Ihren Aufenthalt. Bis zum nächsten Mal!"

[[thank_you.blokken]]
type = "text"
alineas = ["Vielen Dank für Ihren Aufenthalt im {hotel_naam}. Wir hoffen, Sie haben Brügge und Ihr Zimmer genossen.", "Wir freuen uns, Sie wieder begrüßen zu dürfen. Wenn Sie direkt über unsere Website buchen, erhalten Sie garantiert den besten Preis."]

[[thank_you.blokken]]   # onderdeel betaalknop (tabblad Workflow): alleen als er na vertrek nog iets openstaat
module = "pay"
type = "text"
titel = "Bezahlen"
alineas = ["Bei der Kontrolle Ihrer Rechnung haben wir festgestellt, dass noch {openstaand_bedrag} offen ist. Sie können den Betrag unten sicher online bezahlen."]

[[thank_you.blokken]]
module = "pay"
type = "prices"
totaal = "Gesamt"
betaald = "Bereits bezahlt"
open = "Noch zu zahlen"

[[thank_you.blokken]]
module = "pay"
type = "button"
tekst = "Jetzt bezahlen ({openstaand_bedrag})"
link = "{betaal_link}"

[[thank_you.blokken]]
module = "pay"
type = "text"
alineas = ["Haben Sie eine Frage zur Rechnung? Antworten Sie einfach auf diese E-Mail oder rufen Sie uns an unter {hotel_telefoon}."]

[[thank_you.blokken]]   # review vragen; alleen als het adres ingevuld is (Instellingen > Hotel > Reviews)
type = "text"
titel = "Ihre Meinung"
alineas = ["Waren Sie zufrieden? Eine kurze Bewertung hilft uns sehr und hilft anderen Reisenden bei der Wahl. Es dauert nur eine Minute."]
alleen_als = "reviews_google_url"

[[thank_you.blokken]]
type = "button"
tekst = "Bewertung auf Google schreiben"
link = "{reviews_google_url}"
alleen_als = "reviews_google_url"

[[thank_you.blokken]]
type = "button"
tekst = "Oder auf einer anderen Seite"
link = "{reviews_other_url}"
alleen_als = "reviews_other_url"

[payment_request]
onderwerp = "Offener Betrag für Ihren Aufenthalt im {hotel_naam}"
voorvertoning = "Für Ihren Aufenthalt ist noch ein Betrag offen."
aanhef = "Guten Tag {voornaam},"
afsluiting = "Mit freundlichen Grüßen,"
sms = "{hotel_naam}: Guten Tag {voornaam}, für Ihren Aufenthalt sind noch {openstaand_bedrag} offen. Mehr dazu in Ihrer E-Mail."

[[payment_request.blokken]]
type = "text"
alineas = ["Vielen Dank für Ihren Aufenthalt im {hotel_naam}. Bei der Kontrolle Ihrer Rechnung haben wir festgestellt, dass noch ein Betrag offen ist."]

[[payment_request.blokken]]
type = "text"
alineas = ["Haben Sie eine Frage zur Rechnung? Antworten Sie einfach auf diese E-Mail oder rufen Sie uns an unter {hotel_telefoon}."]

# Bouwstenen die een stap kan meekrijgen als ze niet in de eigen tekst staan (tabblad Workflow,
# inhoud van de mail). module = ... in een blok hierboven: dat blok hoort bij die bouwsteen.


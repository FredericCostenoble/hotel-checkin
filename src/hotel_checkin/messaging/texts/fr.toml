# Textes des messages aux clients, français. Même structure que nl.toml.

[algemeen]
meerdere_kamers = "{aantal} chambres : {kamers}"   # kamer in de reservatiegegevens bij meer dan één kamer
team = "L'équipe de l'{hotel_naam}"
voettekst = "Vous recevez cet e-mail parce que vous avez une réservation à l'{hotel_naam}."

[confirmation]
onderwerp = "Votre séjour à l'{hotel_naam}, du {aankomst} au {vertrek}"
voorvertoning = "Merci pour votre réservation. Veuillez compléter vos données d'enregistrement."
aanhef = "Bonjour {voornaam},"
afsluiting = "À bientôt,"
sms = "{hotel_naam} : {voornaam}, merci pour votre réservation. Complétez vos données d'enregistrement et recevez votre code PIN personnel avant votre arrivée : {checkin_link}"

[[confirmation.blokken]]
type = "text"
alineas = ["Nous vous remercions pour votre réservation à l'{hotel_naam}. Nous nous réjouissons de vous accueillir au cœur de Bruges."]

[[confirmation.blokken]]
module = "reservation"
type = "details"
titel = "Votre réservation"
rijen = [["Arrivée", "{aankomst}"], ["Départ", "{vertrek}"], ["Chambre", "{kamertype}"], ["Numéro de réservation", "{reservatienummer}"]]

[[confirmation.blokken]]
module = "checkin_form"
type = "text"
titel = "Un enregistrement facile"
alineas = ["Pour que votre arrivée se passe le mieux possible, nous vous demandons de compléter quelques données. Nous en avons déjà rempli une partie pour vous. Cela ne prend que quelques minutes."]

[[confirmation.blokken]]
module = "checkin_form"
type = "button"
tekst = "Compléter mes données"
link = "{checkin_link}"

[[confirmation.blokken]]
module = "checkin_form"
type = "text"
alineas = ["Grâce à ces données, nous vous enverrons avant votre arrivée toutes les informations pratiques, dont un code PIN personnel pour la porte d'entrée et la porte de votre chambre pendant votre séjour. Vous pourrez ainsi entrer à tout moment, même en dehors des heures d'ouverture de la réception."]

[[confirmation.blokken]]
type = "text"
alineas = ["Notre réception est ouverte tous les jours de {receptie_van} à {receptie_tot}. Vous y êtes toujours le bienvenu pour vos questions ou des conseils sur Bruges."]

[reminder]
onderwerp = "Plus qu'une semaine avant votre séjour à l'{hotel_naam}"
voorvertoning = "Complétez vos données d'enregistrement et recevez votre code PIN personnel."
aanhef = "Bonjour {voornaam},"
afsluiting = "À la semaine prochaine,"
sms = "{hotel_naam} : {voornaam}, dans une semaine vous serez notre hôte. Complétez vos données d'enregistrement et recevez votre code PIN personnel : {checkin_link}"

[[reminder.blokken]]
type = "text"
alineas = ["Dans une semaine, nous aurons le plaisir de vous accueillir à l'{hotel_naam}. Nous avons remarqué que vos données d'enregistrement ne sont pas encore complètes."]

[[reminder.blokken]]
module = "reservation"
type = "details"
titel = "Votre réservation"
rijen = [["Arrivée", "{aankomst}"], ["Départ", "{vertrek}"], ["Numéro de réservation", "{reservatienummer}"]]

[[reminder.blokken]]
module = "checkin_form"
type = "text"
alineas = ["Complétez-les maintenant et vous recevrez avant votre arrivée toutes les informations pratiques ainsi que votre code PIN personnel pour la porte d'entrée et la porte de votre chambre. Cela ne prend que quelques minutes."]

[[reminder.blokken]]
module = "checkin_form"
type = "button"
tekst = "Compléter mes données"
link = "{checkin_link}"

[[reminder.blokken]]
type = "text"
alineas = ["Notre réception est ouverte tous les jours de {receptie_van} à {receptie_tot}."]

[access_code]
onderwerp = "Votre code PIN et les informations pratiques pour l'{hotel_naam}"
voorvertoning = "Votre code PIN personnel et tout ce dont vous avez besoin pour votre séjour."
aanhef = "Bonjour {voornaam},"
afsluiting = "À très bientôt,"
sms = "{hotel_naam} : {voornaam}, à très bientôt ! Votre code PIN pour la porte d'entrée et la chambre {kamernummer} : {pincode}, puis la touche flèche. Valable du {code_geldig_van} au {code_geldig_tot}. Toutes les informations se trouvent dans votre e-mail."

[[access_code.blokken]]
type = "text"
alineas = ["Votre séjour approche. Vous trouverez ci-dessous tout ce dont vous avez besoin pour votre séjour."]

[[access_code.blokken]]
module = "code"
type = "highlight"
titel = "Votre code PIN personnel"
waarde = "{pincode}"
alineas = ["Ce code ouvre la porte d'entrée et la porte de votre chambre du {code_geldig_van} au {code_geldig_tot}.", "Appuyez toujours sur la touche flèche ↵ après le code.", "Votre chambre : {kamernummer}"]

[[access_code.blokken]]
module = "practical_info"
type = "list"
titel = "Votre arrivée"
items = [
  "Adresse : {hotel_adres}",
  "L'enregistrement est possible à partir de {receptie_van}. La réception est ouverte jusqu'à {receptie_tot}. Si vous arrivez plus tard, rendez-vous directement dans votre chambre grâce à votre code PIN.",
  "Saisissez votre code PIN sur le clavier de la porte d'entrée, puis appuyez sur la touche flèche ↵. Faites de même à la porte de votre chambre.",
  "Notre hôtel ne dispose pas d'ascenseur. Si vous avez besoin d'aide pour vos bagages, adressez-vous à la réception.",
]

[[access_code.blokken]]
module = "practical_info"
type = "list"
titel = "Pendant votre séjour"
items = [
  "Petit-déjeuner : tous les jours de {ontbijt_van} à {ontbijt_tot} dans notre cave voûtée du XIVe siècle.",
  "Wi-Fi : {wifi_naam}, mot de passe {wifi_wachtwoord}",
  "Stationnement : l'hôtel ne dispose pas de parking privé. Le parking {parking_naam} se trouve à {parking_minuten} minutes à pied.",
]

[[access_code.blokken]]
module = "practical_info"
type = "text"
titel = "Départ"
alineas = ["Le départ se fait jusqu'à {checkout_tot}. Vous pouvez laisser vos bagages chez nous gratuitement."]

[[access_code.blokken]]
type = "text"
alineas = ["Une question ? Appelez-nous au {hotel_telefoon} ou répondez simplement à cet e-mail."]

[at_the_door]
sms = "{hotel_naam} : bienvenue, {voornaam} ! Saisissez {pincode} puis la touche flèche, d'abord à la porte d'entrée, ensuite à la chambre {kamernummer}. Un problème ? Appelez le {nood_nummer}."

[thank_you]
onderwerp = "Merci pour votre séjour à l'{hotel_naam}"
voorvertoning = "Merci et à une prochaine fois."
aanhef = "Bonjour {voornaam},"
afsluiting = "Bien cordialement,"
sms = "{hotel_naam} : {voornaam}, merci pour votre séjour. Au plaisir de vous revoir !"

[[thank_you.blokken]]
type = "text"
alineas = ["Merci beaucoup pour votre séjour à l'{hotel_naam}. Nous espérons que vous avez apprécié Bruges et votre chambre.", "Nous serons ravis de vous accueillir à nouveau. En réservant directement sur notre site, vous êtes sûr d'obtenir le meilleur prix."]

[[thank_you.blokken]]   # review vragen; alleen als het adres ingevuld is (Instellingen > Hotel > Reviews)
type = "text"
titel = "Votre avis"
alineas = ["Vous avez apprécié votre séjour ? Un court avis nous aide énormément et aide d'autres voyageurs à choisir. Cela ne prend qu'une minute."]
alleen_als = "reviews_google_url"

[[thank_you.blokken]]
type = "button"
tekst = "Laisser un avis sur Google"
link = "{reviews_google_url}"
alleen_als = "reviews_google_url"

[[thank_you.blokken]]
type = "button"
tekst = "Ou sur un autre site"
link = "{reviews_other_url}"
alleen_als = "reviews_other_url"

[payment_request]
onderwerp = "Montant restant dû pour votre séjour à l'{hotel_naam}"
voorvertoning = "Un montant reste dû pour votre séjour."
aanhef = "Bonjour {voornaam},"
afsluiting = "Bien cordialement,"
sms = "{hotel_naam} : {voornaam}, il reste {openstaand_bedrag} à régler pour votre séjour. Plus d'infos dans votre e-mail."

[[payment_request.blokken]]
type = "text"
alineas = ["Merci pour votre séjour à l'{hotel_naam}. En vérifiant votre facture, nous avons constaté qu'un montant reste dû."]

[[payment_request.blokken]]
type = "text"
alineas = ["Une question sur la facture ? Répondez simplement à cet e-mail ou appelez-nous au {hotel_telefoon}."]


[incoming]
# Automatisch antwoord als een gast een WhatsApp of sms terugstuurt naar het nummer van de automatische berichten
# (processes/incoming.py). Het bericht zelf gaat per mail naar het hotel ([twilio] doorsturen).
antwoord = "{hotel_naam}: este número solo envía mensajes automáticos. Su mensaje se ha reenviado a recepción. Para una respuesta más rápida, escríbanos por WhatsApp al {twilio_contact_whatsapp} o llame al {hotel_telefoon}."

[find_stay]
onderwerp = "Su página de estancia en {hotel_naam}"
mail = ["Estimado/a {voornaam}:", "Ha pedido el enlace a su página de estancia. Allí encontrará su código PIN, abrirá las puertas durante su estancia y tendrá toda la información práctica.", "¿No lo ha pedido usted? Entonces no tiene que hacer nada."]
knop = "Abrir mi página de estancia"
sms = "{hotel_naam}: su página de estancia con su código PIN y toda la información: {link}"
whatsapp_tekst = "Mi estancia"
whatsapp_gevonden = "Hola {voornaam}, aquí tiene su página de estancia en {hotel_naam}, con su código PIN, las puertas y toda la información: {link}"
whatsapp_niet_gevonden = "{hotel_naam}: no encontramos ninguna reserva de hoy o mañana con este número. Use el enlace de nuestro correo, o escanee de nuevo el código QR y elija el correo o su nombre. ¿No funciona? Llame al {hotel_telefoon}."

  "Enter your PIN code on the keypad of the front door, then press the arrow key ↵. Do the same at your room door.",
  "Our hotel has no lift. If you need help with your luggage, please ask at reception.",
]

[[modules.practical_info]]
type = "list"
titel = "During your stay"
items = [
  "Breakfast: every day from {ontbijt_van} to {ontbijt_tot} in our 14th-century vaulted cellar.",
  "Wi-Fi: {wifi_naam}, password {wifi_wachtwoord}",
  "Parking: the hotel has no car park of its own. {parking_naam} car park is a {parking_minuten}-minute walk away.",
]

[[modules.practical_info]]
type = "text"
titel = "Departure"
alineas = ["Check-out is until {checkout_tot}. You are welcome to leave your luggage with us free of charge."]

[[modules.pay_open_amount]]
type = "text"
titel = "Payment"
alineas = ["An amount of {openstaand_bedrag} is still open for your stay. You can pay it securely online now, so you don't have to think about it when you arrive."]

[[modules.pay_open_amount]]
type = "prices"
totaal = "Total"
betaald = "Already paid"
open = "Still to pay"

[[modules.pay_open_amount]]
type = "button"
tekst = "Pay now ({openstaand_bedrag})"
link = "{betaal_link}"

[[modules.pay_city_tax]]
type = "text"
titel = "City tax"
alineas = ["The city of Bruges charges a city tax of {toeristenbelasting_tarief}. For your stay this comes to {toeristenbelasting}. It is not included in the price you paid via {kanaal}. You can pay it securely online now."]

[[modules.pay_city_tax]]
type = "button"
tekst = "Pay city tax ({toeristenbelasting})"
link = "{betaal_link}"

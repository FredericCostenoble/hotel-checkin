[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-checkin"
version = "0.1.0"
description = "Bouwblokken voor de geautomatiseerde hotel check-in"
requires-python = ">=3.11"
dependencies = [
  "httpx~=0.28",
  "azure-identity~=1.27",
  "azure-keyvault-secrets~=4.12",
]

[project.optional-dependencies]
messaging = ["twilio~=9.12"]
lighthouse = ["playwright~=1.63", "pyotp~=2.10"]
storage = ["azure-data-tables~=12.7"]
functions = ["azure-functions~=1.25", "openpyxl~=3.1"]
all = ["hotel-checkin[messaging,lighthouse,storage,functions]"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hotel_checkin.messaging" = ["texts/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"  # zelfde als Azure (Function App en robot)

[tool.ruff.lint]
# Bewuste keuzes, geen fouten:
# S110/S112: try-except-pass is hier "faal zacht" (staat erbij waarom, en de volgende run probeert opnieuw)
# LOG015: logging.info(...) op de root-logger is genoeg voor Azure (Application Insights)
# DTZ011: date.today() alleen nog in voorbeelden; de workflow gebruikt core/clock.py (tijdzone van het hotel)
# PYI034: __enter__ geeft de sessie terug, met een expliciet type
ignore = ["S110", "S112", "LOG015", "DTZ011", "PYI034"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]  # vaste testdatums zonder tijdzone

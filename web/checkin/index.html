<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#B4BCCC">
<title>Hotel Lucca</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" id="touch-icon" href="favicon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" id="app-title" content="Hotel Lucca">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="band">
  <a id="logo-link" href="https://www.hotellucca.be" target="_blank" rel="noopener"><img id="logo" src="https://hotellucca.be/wp-content/uploads/2025/06/Logo-website-hotel-lucca.png" alt="Hotel Lucca"></a>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="nl">NL</button><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button><button type="button" data-lang="es">ES</button>
  </nav>
</header>

<section class="guest" id="guest" hidden></section>

<main class="cards" id="cards">
  <p id="loading" class="muted" data-t="loading"></p>
  <p id="offline" class="offline" data-t="offline_note" hidden></p>

  <!-- Melding: link ongeldig, geannuleerd, afgelopen -->
  <section class="card" id="message-card" hidden>
    <p class="thanks" id="message-title"></p>
    <p class="muted" id="message-text"></p>
  </section>

  <!-- Wat is deze pagina, en de stappen -->
  <section class="card" id="intro-card" hidden></section>
  <section class="card" id="after-card" hidden></section>
  <section class="card" id="todo-card" hidden></section>
  <section class="card" id="access-card" hidden></section>
  <section class="card" id="home-card" hidden></section>
  <div class="btnrow" id="contact-row" hidden></div>

  <!-- Jouw gegevens: formulier (open) of samenvatting (dichtgeklapt) -->
  <section class="card" id="details-card" hidden>
    <h2 class="ct"><span data-t="card_details"></span><span id="details-badge"></span></h2>
    <p id="saved" class="toast" data-t="saved" hidden></p>
    <div id="details-summary" hidden>
      <div class="rows" id="details-rows"></div>
      <button type="button" class="btn2" id="details-edit" data-t="change"></button>
    </div>
    <form id="form" novalidate hidden>
      <div style="display:flex;flex-direction:column;gap:16px">
        <p id="form-intro"></p>
        <div class="field">
          <label for="email" data-t="email"></label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <p class="error" id="err-email" data-t="err_email" hidden></p>
        </div>
        <div class="field">
          <label for="phone" data-t="phone"></label>
          <div class="tel">
            <span class="cc-wrap"><select id="phone_cc" class="cc" aria-label="Country"></select><span class="cc-label" aria-hidden="true"></span></span>
            <input id="phone" name="phone" type="tel" autocomplete="tel-national" inputmode="numeric">
          </div>
          <p class="hint" data-t="phone_hint"></p>
          <p class="error" id="err-phone" data-t="err_phone" hidden></p>
        </div>
        <details id="backup-box" class="backup">
          <summary data-t="backup_toggle"></summary>
          <p class="hint" data-t="backup_hint"></p>
          <div class="field">
            <label for="backup_email"><span data-t="backup_email"></span> <span class="opt" data-t="optional"></span></label>
            <input id="backup_email" name="backup_email" type="email" autocomplete="off">
            <p class="error" id="err-backup_email" data-t="err_email" hidden></p>
          </div>
          <div class="field">
            <label for="backup_phone"><span data-t="backup_phone"></span> <span class="opt" data-t="optional"></span></label>
            <div class="tel">
              <span class="cc-wrap"><select id="backup_phone_cc" class="cc" aria-label="Country"></select><span class="cc-label" aria-hidden="true"></span></span>
              <input id="backup_phone" name="backup_phone" type="tel" autocomplete="off" inputmode="numeric">
            </div>
            <p class="error" id="err-backup_phone" data-t="err_phone" hidden></p>
          </div>
        </details>
        <div class="field">
          <label for="language" data-t="language"></label>
          <select id="language" name="language">
            <option value="nl">Nederlands</option><option value="fr">Français</option>
            <option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option>
          </select>
        </div>
        <fieldset class="field" id="stairs-box" hidden>
          <legend id="stairs-q"></legend>
          <p class="hint" id="stairs-text"></p>
          <div class="choice">
            <label><input type="radio" name="stairs" id="stairs_yes" value="yes"><span data-t="yes"></span></label>
            <label><input type="radio" name="stairs" id="stairs_no" value="no"><span data-t="no"></span></label>
          </div>
        </fieldset>
        <p class="privacy"><span data-t="privacy_before"></span> <a id="privacy-link" href="#" target="_blank" rel="noopener" data-t="privacy_link"></a>.</p>
        <label class="check fine"><input id="no_marketing" type="checkbox"><span data-t="no_marketing"></span></label>
        <button type="submit" class="btn" id="submit" data-t="submit"></button>
        <p class="error" id="err-general" hidden></p>
      </div>
    </form>
  </section>

  <section class="card" id="stay-card" hidden></section>
  <section class="card" id="practical-card" hidden></section>
</main>

<footer class="foot" id="foot">
  <strong id="f-name">Hotel Lucca</strong><br>
  <span id="f-address">Naaldenstraat 30, 8000 Brugge</span><br>
  <a id="f-phone" href="tel:+32478083049">+32 478 08 30 49</a> | <a id="f-email" href="mailto:info@hotellucca.be">info@hotellucca.be</a>
</footer>
</div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="countries.js"></script>
<script src="app.js"></script>
</body>
</html>

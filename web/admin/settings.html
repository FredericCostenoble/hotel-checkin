<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in monitor - instellingen</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="admin.css?v=__VERSION__">
</head>
<body data-page="settings">
<header>
  <a class="brand" href="./">
    <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><rect width="64" height="64" rx="14" fill="currentColor"/><circle cx="24" cy="32" r="11" fill="none" stroke="#fff" stroke-width="6"/><path d="M35 32h20M47 32v9M54 32v7" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>
    <span class="name"><b>Check-in</b> monitor</span>
    <span class="env env-__ENV__">__ENV__</span>
  </a>
  <label><span data-t="hotel"></span> <select id="hotel"></select></label>
  <span id="version" class="version" title="commit __COMMIT__, __BUILT__">v__VERSION__ · __COMMIT__</span>
  <a id="settings" class="settings-btn active" href="settings.html"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="settings"></span></a>
  <span class="langs"><button data-lang="nl">NL</button><button data-lang="en">EN</button></span>
</header>

<div class="page-title"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><h1 data-t="settings"></h1></div>

<nav>
  <button data-tab="workflow" class="active"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 7.5v9M8.3 6.2l7.4 4.6M8.3 17.8l7.4-4.6"/></svg><span data-t="tab_workflow"></span></button>
  <button data-tab="hotel"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4"/></svg><span data-t="tab_hotel"></span></button>
  <button data-tab="robot"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 13v1M15 13v1M9 17h6M2 13v3M22 13v3"/><circle cx="12" cy="3.5" r="1"/></svg><span data-t="tab_robot"></span></button>
</nav>

<main>
  <section id="tab-workflow">
    <div class="tools">
      <div id="wf-flows" class="subtabs"></div>
      <div class="right">
        <span id="wf-meta" class="muted"></span>
        <button id="wf-reset" type="button" data-t="wf_reset"></button>
        <button id="wf-save" type="button" class="primary" data-t="wf_save" disabled></button>
      </div>
    </div>
    <p id="wf-state" class="muted"></p>
    <div class="wf-grid">
      <div id="wf-timeline"></div>
      <aside id="wf-side"></aside>
    </div>
  </section>

  <section id="tab-hotel" hidden>
    <div class="tools">
      <p class="muted" data-t="hs_intro"></p>
      <div class="right">
        <span id="hs-meta" class="muted"></span>
        <button id="hs-reset" type="button" data-t="wf_reset"></button>
        <button id="hs-save" type="button" class="primary" data-t="wf_save" disabled></button>
      </div>
    </div>
    <p id="hs-state" class="muted"></p>
    <div id="hs-sections" class="hs-grid"></div>
  </section>

  <section id="tab-robot" hidden>
    <div class="tools">
      <label id="hours-wrap"><span data-t="hours_a"></span> <input id="hours" type="number" value="48" min="1" max="720"> <span data-t="hours_b"></span></label>
      <button id="run" data-t="run"></button>
      <span id="robot-state" class="muted"></span>
      <div class="right">
        <div class="subtabs">
          <button type="button" data-sub="log" class="active" data-t="sub_log"></button>
          <select id="task" aria-label="Task"></select>
          <button type="button" data-sub="azure" id="sub-azure" hidden data-t="exec_title"></button>
        </div>
      </div>
    </div>
    <div id="sub-log">
    <table>
      <thead><tr><th data-t="r_start"></th><th data-t="r_duration"></th><th data-t="r_task"></th><th data-t="r_result"></th>
        <th data-t="r_found"></th><th data-t="r_new"></th><th data-t="r_error"></th><th><button type="button" id="bin-all" class="bin"></button></th></tr></thead>
      <tbody id="runs"></tbody>
    </table>
    </div>
    <div id="exec-wrap" hidden>
      <table>
        <thead><tr><th data-t="r_start"></th><th data-t="exec_end"></th><th data-t="r_duration"></th><th data-t="exec_status"></th><th data-t="exec_name"></th></tr></thead>
        <tbody id="execs"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="preview" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <strong id="pv-title"></strong>
      <span id="pv-langs" class="subtabs"></span>
      <button id="pv-close" type="button" class="reset">&times;</button>
    </div>
    <p id="pv-subject" class="muted"></p>
    <iframe id="pv-frame" title="preview"></iframe>
  </div>
</div>
<script src="admin.js?v=__VERSION__"></script>
</body>
</html>

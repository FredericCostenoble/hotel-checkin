<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in monitor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="admin.css?v=__VERSION__">
<link rel="stylesheet" href="design.css?v=__VERSION__">
</head>
<body data-page="main">
<div id="tstbar" class="tst v2" hidden><span class="envpill">TST</span><span data-t="tst_bar"></span><a id="tst-switch" href="#"><span data-t="env_to_prd"></span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></div>
<header class="mhead v2"><button class="ibtn" id="m-menu" type="button" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><img id="mlogo" alt=""><span style="margin-left:auto"></span><span class="envpill env-__ENV__" data-env>__ENV__</span><button class="ibtn" id="m-hotel" type="button" aria-label="Hotel"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16"/><path d="M15 10h4a1 1 0 0 1 1 1v10M2 21h20M8 8h3M8 12h3M8 16h3"/></svg></button></header>
<div id="mswitches" class="mswitch v2" aria-label="Hoofdschakelaars"></div>
<div class="shell">
<aside class="side v2">
  <div class="band"><img id="logo" alt=""></div>
  <div class="hotelsel"><label for="hotel" data-t="hotel"></label><select id="hotel" class="select"></select></div>
  <nav class="nav" aria-label="Menu">
    <button data-tab="res" class=""><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V7"/><path d="M21 18v-5a3 3 0 0 0-3-3h-8v6"/><path d="M3 15h18"/><circle cx="6.5" cy="11" r="1.5"/></svg><span data-t="tab_res"></span></button>
    <button data-tab="guests" class=""><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span data-t="tab_guests"></span></button>
    <button data-tab="breakfast" class="lbtn-lists"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/></svg><span data-t="nav_lists"></span></button>
    <div class="sub"><button data-tab="breakfast"><span data-t="tab_breakfast"></span></button><button data-tab="cleaning"><span data-t="tab_cleaning"></span></button></div>
    <a id="settings" href="settings.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="settings"></span></a>
    <div class="sub"><a href="settings.html#hotel"><span data-t="tab_hotel"></span></a><a href="settings.html#workflow"><span data-t="nav_messages"></span></a><a href="settings.html#robot"><span data-t="tab_robot"></span></a></div>
  </nav>
  <div class="sidefoot">
    <div class="langsw" role="group" aria-label="Taal"><button data-lang="nl">NL</button><button data-lang="en">EN</button></div>
    <div class="row" style="justify-content:space-between"><span id="me"></span></div>
    <a class="btn3" href="/.auth/logout" style="padding:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg><span data-t="logout"></span></a>
    <span id="version" title="commit __COMMIT__, __BUILT__">v__VERSION__ · __COMMIT__</span>
  </div>
</aside>
<div class="main">
<div class="topbar v2"><div class="envbox"><span id="env" class="envpill env-__ENV__">__ENV__</span><span id="envname" class="small muted"></span><a id="env-switch" href="#" hidden></a></div><div id="switches" class="switches" aria-label="Hoofdschakelaars"></div></div>
<div id="repair-banner" class="repair-banner" hidden></div>


<section id="tab-res" class="content v2">
  <div class="ph"><div><h1 data-t="tab_res"></h1><div id="res-sub" class="sub" hidden></div></div></div>
  <section class="card resbox">
    <div class="cb filters" style="padding-top:16px">
      <div class="row" style="gap:12px;align-items:flex-end">
        <div class="field" style="flex:2 1 280px"><label for="search" data-t="search_lbl"></label><div class="inwrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" class="input" type="search" data-tp="search"></div></div>
        <div class="field" style="flex:1 1 150px"><label for="from" data-t="stay_from"></label><input id="from" class="input" type="date"></div>
        <div class="field" style="flex:1 1 150px"><label for="to" data-t="stay_to"></label><input id="to" class="input" type="date"></div>
        <button id="today" class="btn2" type="button" data-t="from_today"></button>
        <button id="search-reset" type="button" hidden></button>
      </div>
      <div id="count" class="row small muted"></div>
    </div>
    <div class="tbox d-only"><table>
      <thead id="res-head"><tr><th data-sort="arrival" data-t="c_stay"></th><th data-sort="booking_number" data-t="c_res"></th><th data-sort="guest" data-t="c_guest"></th><th data-sort="room" data-t="c_room_rate"></th><th data-sort="source" data-t="c_channel"></th><th data-sort="pms_status">Lighthouse</th><th data-sort="email" data-t="c_contact"></th><th data-sort="messages" data-t="c_messages"></th><th><span style="position:absolute;left:-9999px">Open</span></th></tr></thead>
      <tbody id="res"></tbody>
    </table></div>
    <div id="mres" class="m-only" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>
</section>
<main class="legacy">


  <section id="tab-guests" hidden>
    <div class="tools">
      <input id="g-search" type="search" data-tp="g_search"><button id="g-search-reset" type="button" class="reset" data-tt="reset">&times;</button>
      <span id="g-count" class="muted"></span>
      <button id="g-update" type="button" class="secondary" data-t="g_update"></button>
      <span id="g-state" class="muted"></span>
    </div>
    <details id="matches-wrap" hidden>
      <summary id="matches-title"></summary>
      <p class="muted" data-t="m_help"></p>
      <table><tbody id="matches"></tbody></table>
    </details>
    <div class="table-wrap"><table>
      <thead id="g-head"><tr>
        <th data-gsort="name" data-t="c_guest"></th><th data-gsort="email" data-t="c_contact"></th>
        <th data-gsort="country" data-t="g_country"></th><th data-gsort="stays" data-t="g_stays"></th><th data-gsort="cancellations" data-t="g_cancelled"></th>
        <th data-gsort="avg_nights" data-t="g_avg_nights"></th><th data-gsort="avg_persons" data-t="g_avg_persons"></th>
        <th data-gsort="first_stay" data-t="g_first"></th><th data-gsort="last_stay" data-t="g_last"></th>
        <th data-gsort="preferred_channel" data-t="g_channel"></th><th data-gsort="rooms" data-t="g_rooms"></th>
        <th data-gsort="reservations" data-t="tab_res"></th><th data-t="g_msgs"></th>
      </tr></thead>
      <tbody id="guests"></tbody>
    </table></div>
  </section>

  <section id="tab-breakfast" hidden>
    <div class="tools">
      <label><span data-t="dl_day"></span> <input id="breakfast-day" type="date"></label>
      <button id="breakfast-make" type="button" class="primary" data-t="dl_make"></button>
      <button id="breakfast-send" type="button" class="primary" data-t="dl_send"></button>
      <span id="breakfast-state" class="muted"></span>
    </div>
    <p id="breakfast-info" class="info"></p>
    <div class="table-wrap"><table class="lists">
      <colgroup><col class="c-day"><col class="c-made"><col class="c-by"><col><col class="c-sent"><col class="c-act"></colgroup>
      <thead><tr><th data-t="dl_c_day"></th><th data-t="dl_c_made"></th><th data-t="dl_c_by"></th><th data-t="dl_c_content"></th><th data-t="dl_c_sent"></th><th></th></tr></thead>
      <tbody id="breakfast-rows"></tbody>
    </table></div>
  </section>

  <section id="tab-cleaning" hidden>
    <div class="tools">
      <label><span data-t="dl_day"></span> <input id="cleaning-day" type="date"></label>
      <button id="cleaning-make" type="button" class="primary" data-t="dl_make"></button>
      <button id="cleaning-send" type="button" class="primary" data-t="dl_send"></button>
      <span id="cleaning-state" class="muted"></span>
    </div>
    <p id="cleaning-info" class="info"></p>
    <div class="table-wrap"><table class="lists">
      <colgroup><col class="c-day"><col class="c-made"><col class="c-by"><col><col class="c-sent"><col class="c-act"></colgroup>
      <thead><tr><th data-t="dl_c_day"></th><th data-t="dl_c_made"></th><th data-t="dl_c_by"></th><th data-t="dl_c_content"></th><th data-t="dl_c_sent"></th><th></th></tr></thead>
      <tbody id="cleaning-rows"></tbody>
    </table></div>
  </section>

</main>

<div id="msgs" class="modal" hidden>
  <div class="modal-box small">
    <div class="modal-head"><strong id="msgs-title"></strong><button id="msgs-close" type="button" class="reset">&times;</button></div>
    <label class="msgs-pick"><input type="checkbox" id="msgs-on"> <span data-t="mo_label"></span></label>
    <p class="muted small" id="msgs-on-hint"></p>
    <h3 data-t="mg_plan"></h3>
    <div id="msgs-legend" class="legend"></div>
    <ul id="msgs-plan" class="plan"></ul>
    <div id="msgs-attempts">
    <h3 data-t="mg_attempts"></h3>
    <table>
      <thead><tr><th data-t="mg_time"></th><th data-t="mg_message"></th><th data-t="mg_channel"></th><th data-t="mg_to"></th><th data-t="exec_status"></th><th data-t="r_error"></th></tr></thead>
      <tbody id="msgs-rows"></tbody>
    </table>
    </div>
  </div>
</div>

</div>
</div>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in monitor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="admin.css?v=__VERSION__">
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><rect width="64" height="64" rx="14" fill="currentColor"/><circle cx="24" cy="32" r="11" fill="none" stroke="#fff" stroke-width="6"/><path d="M35 32h20M47 32v9M54 32v7" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>
    <span class="name"><b>Check-in</b> monitor</span>
    <span class="env env-__ENV__">__ENV__</span>
  </div>
  <label><span data-t="hotel"></span> <select id="hotel"></select></label>
  <span id="version" class="version" title="commit __COMMIT__, __BUILT__">v__VERSION__ · __COMMIT__</span>
  <span class="langs"><button data-lang="nl">NL</button><button data-lang="en">EN</button></span>
</header>

<nav>
  <button data-tab="res" class="active"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="tab_res"></span></button>
  <button data-tab="guests"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.7 3.5 5.7"/></svg><span data-t="tab_guests"></span></button>
  <button data-tab="workflow"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 7.5v9M8.3 6.2l7.4 4.6M8.3 17.8l7.4-4.6"/></svg><span data-t="tab_workflow"></span></button>
  <button data-tab="robot"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 13v1M15 13v1M9 17h6M2 13v3M22 13v3"/><circle cx="12" cy="3.5" r="1"/></svg><span data-t="tab_robot"></span></button>
</nav>

<main>
  <section id="tab-res">
    <div class="tools">
      <input id="search" type="search" data-tp="search"><button id="search-reset" type="button" class="reset" data-tt="reset">&times;</button>
      <label><span data-t="stay_from"></span> <input id="from" type="date"></label>
      <label><span data-t="stay_to"></span> <input id="to" type="date"></label>
      <button id="today" type="button" data-t="from_today"></button>
      <span id="count" class="muted"></span>
    </div>
    <table>
      <thead id="res-head"><tr>
        <th data-sort="arrival" data-t="c_arrival"></th><th data-sort="departure" data-t="c_departure"></th>
        <th data-sort="booking_number" data-t="c_number"></th><th data-sort="guest" data-t="c_guest"></th>
        <th data-sort="guests" data-t="c_pers"></th><th data-sort="room" data-t="c_room"></th>
        <th data-sort="source" data-t="c_via"></th><th data-sort="pms_status">Lighthouse</th>
        <th data-sort="booked_at" data-t="c_booked"></th><th data-sort="added_at" data-t="c_added"></th>
        <th data-sort="updated_at" data-t="c_updated"></th><th data-sort="checkin_completed_at" data-t="c_form"></th>
        <th data-sort="email" data-t="c_contact"></th><th data-sort="messages" data-t="c_messages"></th>
      </tr></thead>
      <tbody id="res"></tbody>
    </table>
  </section>

  <section id="tab-guests" hidden>
    <div class="tools">
      <input id="g-search" type="search" data-tp="g_search"><button id="g-search-reset" type="button" class="reset" data-tt="reset">&times;</button>
      <span id="g-count" class="muted"></span>
      <button id="g-update" type="button" data-t="g_update"></button>
      <span id="g-state" class="muted"></span>
    </div>
    <details id="matches-wrap" hidden>
      <summary id="matches-title"></summary>
      <p class="muted" data-t="m_help"></p>
      <table><tbody id="matches"></tbody></table>
    </details>
    <table>
      <thead id="g-head"><tr>
        <th data-gsort="name" data-t="c_guest"></th><th data-gsort="email" data-t="c_contact"></th>
        <th data-gsort="country" data-t="g_country"></th><th data-gsort="stays" data-t="g_stays"></th><th data-gsort="cancellations" data-t="g_cancelled"></th>
        <th data-gsort="avg_nights" data-t="g_avg_nights"></th><th data-gsort="avg_persons" data-t="g_avg_persons"></th>
        <th data-gsort="first_stay" data-t="g_first"></th><th data-gsort="last_stay" data-t="g_last"></th>
        <th data-gsort="preferred_channel" data-t="g_channel"></th><th data-gsort="rooms" data-t="g_rooms"></th>
        <th data-gsort="reservations" data-t="tab_res"></th><th data-t="g_msgs"></th>
      </tr></thead>
      <tbody id="guests"></tbody>
    </table>
  </section>

  <section id="tab-workflow" hidden>
    <div class="tools">
      <div id="wf-flows" class="subtabs"></div>
      <div class="right">
        <span id="wf-meta" class="muted"></span>
        <button id="wf-reset" type="button" data-t="wf_reset"></button>
        <button id="wf-save" type="button" class="primary" data-t="wf_save" disabled></button>
      </div>
    </div>
    <p id="wf-state" class="muted"></p>
    <div class="wf-grid">
      <div id="wf-timeline"></div>
      <aside id="wf-side"></aside>
    </div>
  </section>

  <section id="tab-robot" hidden>
    <div class="tools">
      <label id="hours-wrap"><span data-t="hours_a"></span> <input id="hours" type="number" value="48" min="1" max="720"> <span data-t="hours_b"></span></label>
      <button id="run" data-t="run"></button>
      <span id="robot-state" class="muted"></span>
      <div class="right">
        <div class="subtabs">
          <button type="button" data-sub="log" class="active" data-t="sub_log"></button>
          <select id="task" aria-label="Task"></select>
          <button type="button" data-sub="azure" id="sub-azure" hidden data-t="exec_title"></button>
        </div>
      </div>
    </div>
    <div id="sub-log">
    <table>
      <thead><tr><th data-t="r_start"></th><th data-t="r_duration"></th><th data-t="r_task"></th><th data-t="r_result"></th>
        <th data-t="r_found"></th><th data-t="r_new"></th><th data-t="r_error"></th><th><button type="button" id="bin-all" class="bin"></button></th></tr></thead>
      <tbody id="runs"></tbody>
    </table>
    </div>
    <div id="exec-wrap" hidden>
      <table>
        <thead><tr><th data-t="r_start"></th><th data-t="exec_end"></th><th data-t="r_duration"></th><th data-t="exec_status"></th><th data-t="exec_name"></th></tr></thead>
        <tbody id="execs"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="msgs" class="modal" hidden>
  <div class="modal-box small">
    <div class="modal-head"><strong id="msgs-title"></strong><button id="msgs-close" type="button" class="reset">&times;</button></div>
    <h3 data-t="mg_plan"></h3>
    <ul id="msgs-plan" class="plan"></ul>
    <div id="msgs-attempts">
    <h3 data-t="mg_attempts"></h3>
    <table>
      <thead><tr><th data-t="mg_time"></th><th data-t="mg_message"></th><th data-t="mg_channel"></th><th data-t="mg_to"></th><th data-t="exec_status"></th><th data-t="r_error"></th></tr></thead>
      <tbody id="msgs-rows"></tbody>
    </table>
    </div>
  </div>
</div>

<div id="preview" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <strong id="pv-title"></strong>
      <span id="pv-langs" class="subtabs"></span>
      <button id="pv-close" type="button" class="reset">&times;</button>
    </div>
    <p id="pv-subject" class="muted"></p>
    <iframe id="pv-frame" title="preview"></iframe>
  </div>
</div>
<script src="admin.js?v=__VERSION__"></script>
</body>
</html>
